function worldPointFromScreen(sx, sy) {
  return { x: sx + world.camX, y: sy + world.camY };
}

function updatePlaying(dt) {
  if (hud.hintTimer > 0) { hud.hintTimer -= dt; if (hud.hintTimer < 0) hud.hintTimer = 0; }

  // level-up choice popup (blocking, per bug registry exception)
  if (player.levelUpChoicePending) {
    updateLevelUpInput();
    return;
  }

  // shop popup pauses the world
  if (shop.active) {
    updateShopInput();
    return;
  }

  // wardrobe popup pauses the world
  if (wardrobe.active) {
    updateWardrobeInput();
    return;
  }

  // P key or HUD button opens the wardrobe from normal play
  if (Input.keys['p'] || Input.keys['P']) { Input.keys['p'] = Input.keys['P'] = false; openWardrobe(); return; }
  if (Input.tapped && tapWardrobeButton(Input.tapX, Input.tapY)) { Input.tapped = false; openWardrobe(); return; }

  // dialogue pauses the world
  if (dialogue.active) {
    if (Input.tapped) { advanceDialogue(); Input.tapped = false; }
    if (Input.keys['e'] || Input.keys['E'] || Input.keys['Enter']) {
      advanceDialogue();
      Input.keys['e'] = Input.keys['E'] = Input.keys['Enter'] = false;
    }
    return;
  }

  // math popup pauses the world (works even mid-boss-fight later; bug #5)
  if (mathPopup.active) {
    updateMathPopupInput();
    return;
  }

  // always-available Q shortcut to open the math popup (also updates timers)
  if (Input.keys['q'] || Input.keys['Q']) {
    Input.keys['q'] = Input.keys['Q'] = false;
    openMathPopup('ap');
  }

  if (player.attackCooldown > 0) player.attackCooldown -= dt;
  if (player.invincibleT > 0) player.invincibleT -= dt;
  if (player.swordSwingT > 0) player.swordSwingT -= dt;
  if (shakeT > 0) shakeT -= dt;

  if (player.zeroApAttackTimer > 0) {
    player.zeroApAttackTimer += dt;
    if (player.zeroApAttackTimer > 1) {
      player.zeroApAttackTimer = 0;
      openMathPopup('ap');
    }
  }

  // downed (0 hearts): world dims, hero can't move, revive popup already open
  if (player.downed) {
    updateFloatingAndConfetti(dt);
    return;
  }

  const map = currentMap();

  // --- keyboard movement (overrides tap target) ---
  let dx = 0, dy = 0;
  if (Input.keys['ArrowLeft'] || Input.keys['a'] || Input.keys['A']) dx -= 1;
  if (Input.keys['ArrowRight'] || Input.keys['d'] || Input.keys['D']) dx += 1;
  if (Input.keys['ArrowUp'] || Input.keys['w'] || Input.keys['W']) dy -= 1;
  if (Input.keys['ArrowDown'] || Input.keys['s'] || Input.keys['S']) dy += 1;

  let moving = false;

  if (dx !== 0 || dy !== 0) {
    hero.walkTargetX = null; hero.walkTargetY = null; // keyboard cancels tap-move
    const len = Math.hypot(dx, dy) || 1;
    moveWithCollision(hero, (dx / len) * CONFIG.HERO_SPEED * dt, (dy / len) * CONFIG.HERO_SPEED * dt, map);
    if (dx < 0) hero.facing = 'left';
    else if (dx > 0) hero.facing = 'right';
    else if (dy < 0) hero.facing = 'up';
    else if (dy > 0) hero.facing = 'down';
    moving = true;
  }

  // --- tap on weapon slot HUD (screen space, checked before world taps) ---
  if (Input.tapped && tapWeaponSlot(Input.tapX, Input.tapY)) {
    Input.tapped = false;
  }

  // --- tap-to-move / tap-to-attack / tap-to-interact ---
  if (Input.tapped) {
    const wp = worldPointFromScreen(Input.tapX, Input.tapY);
    const tappedNpc = allNPCs().find(n => Math.hypot(n.x - wp.x, n.y - wp.y) < 14);
    const tappedEnemy = currentEnemies().find(e => e.alive &&
      Math.hypot(e.x - wp.x, e.y - wp.y) < Math.max(CONFIG.ENEMY_TAP_HITBOX_MIN, e.w * CONFIG.ENEMY_TAP_HITBOX_MULT));
    const tappedPot = currentPots().find(p => p.alive && Math.hypot(p.x - wp.x, p.y - wp.y) < 14);
    if (tappedEnemy) {
      hero.pendingTalkTarget = null;
      const slotWeapon = player.slots[player.activeSlot];
      const isRanged = slotWeapon === 'boomerang' || slotWeapon === 'galeBoomerang' || slotWeapon === 'bow';
      if (isRanged) {
        faceToward(tappedEnemy.x, tappedEnemy.y);
        fireActiveWeapon();
        hero.pendingAttackTarget = null;
      } else {
        const d0 = Math.hypot(tappedEnemy.x - hero.x, tappedEnemy.y - hero.y);
        if (d0 > 60) {
          showHint('Too far for your sword!', 1.5);
          hero.pendingAttackTarget = null;
        } else {
          hero.pendingAttackTarget = tappedEnemy;
        }
      }
      hero.walkTargetX = null; hero.walkTargetY = null;
    } else if (tappedPot) {
      hero.pendingTalkTarget = null;
      hero.pendingAttackTarget = tappedPot;
      hero.walkTargetX = null; hero.walkTargetY = null;
    } else if (tappedNpc) {
      hero.pendingTalkTarget = tappedNpc;
      hero.walkTargetX = tappedNpc.x; hero.walkTargetY = tappedNpc.y + 16;
    } else {
      hero.pendingTalkTarget = null; hero.pendingAttackTarget = null;
      hero.walkTargetX = wp.x; hero.walkTargetY = wp.y;
      rippleMarkers.push({ x: wp.x, y: wp.y, life: 0.5 });
    }
    Input.tapped = false;
  }

  // --- tap-to-attack: walk into range then swing ---
  if (hero.pendingAttackTarget) {
    const tgt = hero.pendingAttackTarget;
    if (!tgt.alive) { hero.pendingAttackTarget = null; }
    else {
      const d = Math.hypot(tgt.x - hero.x, tgt.y - hero.y);
      if (d > CONFIG.SWORD_RANGE - 4) {
        const ux = (tgt.x - hero.x) / d, uy = (tgt.y - hero.y) / d;
        moveWithCollision(hero, ux * CONFIG.HERO_SPEED * dt, uy * CONFIG.HERO_SPEED * dt, map);
        if (Math.abs(ux) > Math.abs(uy)) hero.facing = ux < 0 ? 'left' : 'right';
        else hero.facing = uy < 0 ? 'up' : 'down';
        moving = true;
      } else {
        const ang = Math.atan2(tgt.y - hero.y, tgt.x - hero.x);
        if (Math.abs(ang) < Math.PI / 4) hero.facing = 'right';
        else if (Math.abs(ang) > Math.PI * 3 / 4) hero.facing = 'left';
        else hero.facing = ang > 0 ? 'down' : 'up';
        if (player.attackCooldown <= 0) trySwingSword();
        hero.pendingAttackTarget = null;
      }
    }
  }

  // --- keyboard attack: Space / J fires whatever is in the active slot ---
  if (Input.keys[' '] || Input.keys['j'] || Input.keys['J']) {
    Input.keys[' '] = Input.keys['j'] = Input.keys['J'] = false;
    fireActiveWeapon();
  }
  if (Input.keys['n'] || Input.keys['N']) { Input.keys['n'] = Input.keys['N'] = false; fireArrow(); }
  if (Input.keys['b'] || Input.keys['B']) { Input.keys['b'] = Input.keys['B'] = false; throwBomb(); }
  // weapon slot select: 1/2/3 (only reacts if that slot is unlocked)
  for (let s = 0; s < 3; s++) {
    const key = String(s + 1);
    if (Input.keys[key] && player.slots[s]) { Input.keys[key] = false; player.activeSlot = s; }
  }
  if (Input.keys['e'] || Input.keys['E']) {
    // E on a pot in range smashes it too
    const nearPot = currentPots().find(p => p.alive && Math.hypot(p.x - hero.x, p.y - hero.y) < CONFIG.SWORD_RANGE);
    if (nearPot) { smashPot(nearPot); Input.keys['e'] = Input.keys['E'] = false; }
  }

  if (!moving && hero.walkTargetX !== null) {
    const tdx = hero.walkTargetX - hero.x, tdy = hero.walkTargetY - hero.y;
    const dist = Math.hypot(tdx, tdy);
    if (dist < 3) {
      hero.walkTargetX = null; hero.walkTargetY = null;
      if (hero.pendingTalkTarget) {
        const n = hero.pendingTalkTarget; hero.pendingTalkTarget = null;
        if (Math.hypot(n.x - hero.x, n.y - hero.y) < CONFIG.NPC_TALK_RANGE + 20) openDialogue(n);
      }
    } else {
      const ux = tdx / dist, uy = tdy / dist;
      moveWithCollision(hero, ux * CONFIG.HERO_SPEED * dt, uy * CONFIG.HERO_SPEED * dt, map);
      if (Math.abs(ux) > Math.abs(uy)) hero.facing = ux < 0 ? 'left' : 'right';
      else hero.facing = uy < 0 ? 'up' : 'down';
      moving = true;
    }
  }

  hero.moving = moving;
  if (moving) {
    hero.animT += dt;
    if (hero.animT > 0.18) { hero.animT = 0; hero.animFrame = 1 - hero.animFrame; }
    hero.dustTimer -= dt;
    if (hero.dustTimer <= 0) {
      hero.dustTimer = CONFIG.DUST_STEP_INTERVAL;
      dustPuffs.push({ x: hero.x, y: hero.y + hero.h / 2, life: 0.35 });
    }
  } else {
    hero.animFrame = 0;
  }

  // keep hero inside map bounds
  hero.x = Math.max(CONFIG.TILE, Math.min(map.w * CONFIG.TILE - CONFIG.TILE, hero.x));
  hero.y = Math.max(CONFIG.TILE, Math.min(map.h * CONFIG.TILE - CONFIG.TILE, hero.y));

  // --- talk via E key when adjacent ---
  if (Input.keys['e'] || Input.keys['E']) {
    Input.keys['e'] = Input.keys['E'] = false;
    const near = allNPCs().find(n => Math.hypot(n.x - hero.x, n.y - hero.y) < CONFIG.NPC_TALK_RANGE + 20);
    if (near) openDialogue(near);
  }

  // --- NPC wander AI ---
  for (const n of allNPCs()) {
    n.wanderTimer -= dt;
    if (n.wanderTimer <= 0) {
      n.wanderTimer = 1 + Math.random() * 2;
      if (Math.random() < 0.4) { n.wanderDx = 0; n.wanderDy = 0; }
      else {
        const dir = Math.floor(Math.random() * 4);
        n.wanderDx = [1, -1, 0, 0][dir]; n.wanderDy = [0, 0, 1, -1][dir];
      }
    }
    if (n.wanderDx || n.wanderDy) {
      const before = { x: n.x, y: n.y };
      moveWithCollision(n, n.wanderDx * CONFIG.NPC_WANDER_SPEED * dt, n.wanderDy * CONFIG.NPC_WANDER_SPEED * dt, map);
      if (n.x === before.x && n.y === before.y) { n.wanderDx = 0; n.wanderDy = 0; } // hit a solid, stop
      if (Math.abs(n.wanderDx) > 0) n.facing = n.wanderDx < 0 ? 'left' : 'right';
      else if (n.wanderDy) n.facing = n.wanderDy < 0 ? 'up' : 'down';
    }
  }

  // --- building / dungeon entry & transitions ---
  if (world.mode === 'overworld') {
    for (const b of buildings) {
      const a = b.activation;
      if (hero.x >= a.minX && hero.x <= a.maxX && hero.y >= a.minY && hero.y <= a.maxY) {
        enterBuilding(b);
        break;
      }
    }
    for (const d of dungeons) {
      const z = d.entranceZone;
      if (hero.x >= z.minX && hero.x <= z.maxX && hero.y >= z.minY && hero.y <= z.maxY) {
        enterDungeon(d);
        break;
      }
    }
    {
      const z = castleGate.zone;
      if (hero.x >= z.minX && hero.x <= z.maxX && hero.y >= z.minY && hero.y <= z.maxY && !castleGate.hintShown) {
        enterCastle();
        castleGate.hintShown = true;
      } else if (!(hero.x >= z.minX && hero.x <= z.maxX && hero.y >= z.minY && hero.y <= z.maxY)) {
        castleGate.hintShown = false;
      }
    }
  } else if (world.mode === 'interior') {
    const ex = world.interior.exit;
    const exPx = ex.x * CONFIG.TILE, exPy = ex.y * CONFIG.TILE;
    if (Math.abs(hero.x - exPx) < CONFIG.TILE && Math.abs(hero.y - exPy) < CONFIG.TILE) {
      exitBuilding();
    }
  } else if (world.mode === 'dungeon') {
    updateDungeonRoom(dt, map);
  } else if (world.mode === 'castle') {
    updateCastleRoom(dt, map);
  }

  // dust puffs decay
  for (let i = dustPuffs.length - 1; i >= 0; i--) {
    dustPuffs[i].life -= dt;
    if (dustPuffs[i].life <= 0) dustPuffs.splice(i, 1);
  }
  for (let i = rippleMarkers.length - 1; i >= 0; i--) {
    rippleMarkers[i].life -= dt;
    if (rippleMarkers[i].life <= 0) rippleMarkers.splice(i, 1);
  }

  if (world.mode === 'overworld' || world.mode === 'dungeon' || world.mode === 'castle') updateEnemies(dt, map);
  updateBoomerangs(dt, map);
  updateArrows(dt, map);
  updateBombs(dt);
  updateCoinsAndPickups(dt);
  updateFloatingAndConfetti(dt);

  // --- camera clamp ---
  const m = currentMap();
  world.camX = Math.max(0, Math.min(m.w * CONFIG.TILE - CONFIG.GAME_W, hero.x - CONFIG.GAME_W / 2));
  world.camY = Math.max(0, Math.min(m.h * CONFIG.TILE - CONFIG.GAME_H, hero.y - CONFIG.GAME_H / 2));
  if (m.w * CONFIG.TILE < CONFIG.GAME_W) world.camX = -(CONFIG.GAME_W - m.w * CONFIG.TILE) / 2;
  if (m.h * CONFIG.TILE < CONFIG.GAME_H) world.camY = -(CONFIG.GAME_H - m.h * CONFIG.TILE) / 2;
}

let fadeAlpha = 0, fadeDir = 0, fadeCallback = null;
function fadeTo(callback) {
  fadeDir = 1; fadeCallback = callback;
}
function updateFade(dt) {
  if (fadeDir !== 0) {
    fadeAlpha += fadeDir * dt * 3;
    if (fadeAlpha >= 1) {
      fadeAlpha = 1;
      if (fadeCallback) { fadeCallback(); fadeCallback = null; }
      fadeDir = -1;
    } else if (fadeAlpha <= 0) {
      fadeAlpha = 0; fadeDir = 0;
    }
  }
}

function enterBuilding(b) {
  if (world.mode !== 'overworld') return;
  fadeTo(() => {
    world.mode = 'interior';
    world.interior = b.interior;
    world.returnSpot = { x: hero.x, y: hero.y + CONFIG.TILE };
    world.currentBuildingRef = b;
    hero.x = b.interior.exit.x * CONFIG.TILE;
    hero.y = (b.interior.exit.y - 1.2) * CONFIG.TILE;
  });
}
function exitBuilding() {
  fadeTo(() => {
    world.mode = 'overworld';
    hero.x = world.returnSpot.x; hero.y = world.returnSpot.y;
    world.interior = null;
  });
}

// =========================================================================
// Draw
// =========================================================================
function drawPixelText(text, x, y, size, color) {
  ctx.fillStyle = color;
  ctx.font = `bold ${size}px monospace`;
  ctx.textAlign = 'center';
  ctx.fillText(text, x, y);
}

function draw() {
  ctx.clearRect(0, 0, CONFIG.GAME_W, CONFIG.GAME_H);

  if (gameState === STATE.TITLE) {
    ctx.fillStyle = '#1a2f4a';
    ctx.fillRect(0, 0, CONFIG.GAME_W, CONFIG.GAME_H);

    drawPixelText('MATH QUEST', CONFIG.GAME_W / 2, 70, 40, '#ffd84a');
    ctx.strokeStyle = '#7a5210';
    ctx.lineWidth = 2;
    ctx.strokeText('MATH QUEST', CONFIG.GAME_W / 2, 70);

    drawPixelText('Answer math questions to earn Action Points for your sword!',
      CONFIG.GAME_W / 2, 100, 13, '#ffffff');

    const btns = getDifficultyButtons();
    for (const b of btns) {
      const selected = b.name === CONFIG.DIFFICULTY;
      ctx.fillStyle = selected ? '#4caf50' : '#2b3f5c';
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = selected ? 3 : 1;
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeRect(b.x, b.y, b.w, b.h);
      drawPixelText(DIFFICULTY_LABELS[b.name], b.x + b.w / 2, b.y + b.h / 2 + 6, 18, '#ffffff');
    }

    drawPixelText('Tap a difficulty or press Enter to start', CONFIG.GAME_W / 2, CONFIG.GAME_H - 24, 12, '#cccccc');
    drawPixelText('Move: Arrow Keys / WASD / Tap    Attack: Space/J    Math: Q', CONFIG.GAME_W / 2, CONFIG.GAME_H - 10, 10, '#999999');
    return;
  }

  if (gameState === STATE.PLAYING) {
    drawPlaying();
  }

  if (gameState === STATE.VICTORY) {
    drawVictoryScreen();
  }
}

function drawVictoryScreen() {
  ctx.fillStyle = '#1a2f4a';
  ctx.fillRect(0, 0, CONFIG.GAME_W, CONFIG.GAME_H);
  drawPixelText('GANONDORF DEFEATED!', CONFIG.GAME_W / 2, 70, 30, '#ffd84a');
  const secs = Math.floor(victoryStats.timeMs / 1000);
  const mins = Math.floor(secs / 60), rem = secs % 60;
  const lines = [
    'Time: ' + mins + 'm ' + rem + 's',
    'Gold collected: ' + victoryStats.gold,
    'Questions answered: ' + victoryStats.questionsAnswered,
    'Revives used: ' + victoryStats.revivesUsed,
    'Level reached: ' + victoryStats.level,
  ];
  lines.forEach((l, i) => drawPixelText(l, CONFIG.GAME_W / 2, 130 + i * 26, 15, '#ffffff'));
  drawPixelText('Tap or press Enter to play again', CONFIG.GAME_W / 2, CONFIG.GAME_H - 24, 13, '#8effc1');
}

function drawHeroSprite(x, y, facing, frame) {
  // 16x16-ish code-drawn hero: tunic + head, simple 2-frame walk cycle
  const tunic = currentTunic();
  const bodyColor = tunic.body, skin = '#e8b888', hair = '#5a3216';
  const bob = frame === 1 ? 1 : 0;
  ctx.fillStyle = '#000000';
  ctx.globalAlpha = 0.25;
  ctx.beginPath(); ctx.ellipse(x, y + 7, 6, 2.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;

  // shield peeking out on the back when not facing down (ALttP-style nod)
  if (facing !== 'down') {
    ctx.fillStyle = '#8a6a3a';
    ctx.fillRect(x + (facing === 'left' ? 3 : -5), y - 4 - bob, 3, 9);
    ctx.fillStyle = '#c04040';
    ctx.fillRect(x + (facing === 'left' ? 3 : -5), y - 2 - bob, 3, 4);
  }

  ctx.fillStyle = bodyColor;
  ctx.fillRect(x - 5, y - 2 - bob, 10, 8);
  ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1;
  ctx.strokeRect(x - 5.5, y - 2.5 - bob, 11, 9);
  ctx.fillStyle = tunic.trim;
  ctx.fillRect(x - 5, y + 4 - bob, 10, 2);
  ctx.fillStyle = skin;
  ctx.fillRect(x - 4, y - 9 - bob, 8, 7);
  ctx.fillStyle = hair;
  ctx.fillRect(x - 4, y - 9 - bob, 8, 3);
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fillRect(x - 3, y - 9 - bob, 2, 1); // hair highlight

  // direction indicator (simple eyes / arm) so facing is readable
  ctx.fillStyle = '#20140a';
  if (facing === 'down') { ctx.fillRect(x - 2, y - 6 - bob, 1, 1); ctx.fillRect(x + 1, y - 6 - bob, 1, 1); }
  else if (facing === 'up') { ctx.fillStyle = hair; ctx.fillRect(x - 4, y - 9 - bob, 8, 6); }
  else if (facing === 'left') { ctx.fillRect(x - 5, y - 6 - bob, 2, 1); }
  else if (facing === 'right') { ctx.fillRect(x + 3, y - 6 - bob, 2, 1); }

  // simple leg step
  ctx.fillStyle = '#2a2a2a';
  if (frame === 1) { ctx.fillRect(x - 4, y + 5, 3, 3); ctx.fillRect(x + 1, y + 5, 3, 2); }
  else { ctx.fillRect(x - 4, y + 5, 3, 2); ctx.fillRect(x + 1, y + 5, 3, 3); }
}

function drawNpcSprite(x, y, color, facing) {
  const bob = Math.sin(performance.now() / 400 + x) > 0 ? 0 : 1; // slow 2-frame idle breathing
  ctx.fillStyle = '#000000'; ctx.globalAlpha = 0.25;
  ctx.beginPath(); ctx.ellipse(x, y + 7, 6, 2.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = color;
  ctx.fillRect(x - 5, y - 2 - bob, 10, 8);
  ctx.fillStyle = '#e8b888';
  ctx.fillRect(x - 4, y - 9 - bob, 8, 7);
  ctx.fillStyle = '#3a2010';
  ctx.fillRect(x - 4, y - 9 - bob, 8, 3);
}

function drawPlaying() {
  const map = currentMap();
  const canvasImg = currentCanvas();
  const shx = shakeT > 0 ? (Math.random() - 0.5) * shakeMag : 0;
  const shy = shakeT > 0 ? (Math.random() - 0.5) * shakeMag : 0;
  ctx.save();
  ctx.translate(-world.camX + shx, -world.camY + shy);

  ctx.drawImage(canvasImg, 0, 0);

  if (world.mode === 'overworld') {
    for (const p of currentPots()) if (p.alive) { p.isBush ? drawBush(p.x, p.y) : drawPot(p.x, p.y); }
    for (const e of currentEnemies()) if (e.alive) drawEnemy(e);
  }

  // dust puffs
  for (const d of dustPuffs) {
    ctx.globalAlpha = d.life / 0.35 * 0.5;
    ctx.fillStyle = '#cfc19a';
    ctx.beginPath(); ctx.arc(d.x, d.y, 3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // ripple tap markers
  for (const r of rippleMarkers) {
    ctx.strokeStyle = `rgba(255,255,255,${r.life / 0.5})`;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(r.x, r.y, (0.5 - r.life) * 24 + 4, 0, Math.PI * 2); ctx.stroke();
  }

  // NPCs
  for (const n of allNPCs()) drawNpcSprite(n.x, n.y, n.color, n.facing);
  for (const n of allNPCs()) {
    if (Math.hypot(n.x - hero.x, n.y - hero.y) < CONFIG.NPC_TALK_RANGE + 20 && !dialogue.active) {
      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'center';
      ctx.fillText('!', n.x, n.y - 16);
    }
  }

  // hero (blink while invincible)
  if (!(player.invincibleT > 0 && Math.floor(player.invincibleT * 12) % 2 === 0)) {
    drawHeroSprite(hero.x, hero.y, hero.facing, hero.animFrame);
  }
  if (player.swordSwingT > 0) drawSwordArc(hero.x, hero.y, hero.facing, player.swordSwingT);

  if (world.mode === 'overworld') {
    for (const c of coins) drawCoin(c.x, c.y);
    for (const h of heartPickups) drawHeartPickup(h.x, h.y, h.t);
  }
  for (const b of boomerangs) { ctx.fillStyle = '#c9915a'; ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill(); }
  for (const a of arrows) {
    ctx.fillStyle = a.type === 'fire' ? '#ff7030' : a.type === 'ice' ? '#70d0ff' : '#d8d8d8';
    ctx.fillRect(a.x - 4, a.y - 1, 8, 2);
  }
  for (const b of bombs) {
    ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ff5030'; ctx.fillRect(b.x - 1, b.y - 8, 2, 4);
  }
  if (world.mode === 'dungeon') drawDungeonExtras(world.dungeon);
  for (const hp of heartPieces) drawHeartPickup(hp.x, hp.y, hp.t);

  // confetti + floating text (world space)
  for (const c of confettiParticles) {
    ctx.globalAlpha = Math.max(0, c.life);
    ctx.fillStyle = c.color;
    ctx.fillRect(c.x - 2, c.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
  for (const f of floatingTexts) {
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.fillStyle = f.color; ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  // dim overlay while downed (never a game-over screen, bug #8)
  if (player.downed) {
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, CONFIG.GAME_W, CONFIG.GAME_H);
  }

  // HUD (screen space)
  drawHUD();

  // weapon slots + XP bar (always visible during play)
  drawWeaponSlots();
  drawXPBar();
  drawSpeakerIcon();
  drawWardrobeButton();

  // boss HP bar (top of screen, Phase 5)
  if (world.mode === 'castle' && castle.roomIndex === 1 && castle.ganon && castle.ganon.alive) {
    drawBossHPBar(castle.ganon);
  }

  // dialogue box
  if (dialogue.active) drawDialogueBox();

  // shop
  if (shop.active) drawShop();

  // wardrobe
  if (wardrobe.active) drawWardrobe();

  // level-up choice (blocking, allowed exception)
  if (player.levelUpChoicePending) drawLevelUpPopup();

  // math popup (blocking box; correct-answer celebration itself never blocks)
  if (mathPopup.active) drawMathPopup();

  // hint text
  if (hud.hintTimer > 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(CONFIG.GAME_W / 2 - 160, 40, 320, 26);
    ctx.fillStyle = '#ffe066';
    ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center';
    ctx.fillText(hud.hintText, CONFIG.GAME_W / 2, 58);
  }

  // region weather overlay (Phase 8) - drawn in screen space, cheap and
  // stateless (positions derived from time so nothing needs updating)
  if (world.mode === 'overworld') drawWeatherOverlay();

  // fade overlay
  if (fadeAlpha > 0) {
    ctx.fillStyle = `rgba(0,0,0,${fadeAlpha})`;
    ctx.fillRect(0, 0, CONFIG.GAME_W, CONFIG.GAME_H);
  }
}

function drawWeatherOverlay() {
  const tx = Math.floor(hero.x / CONFIG.TILE), ty = Math.floor(hero.y / CONFIG.TILE);
  const region = regionAt(tx, ty);
  const t = performance.now() / 1000;
  if (region === 'forest') {
    ctx.strokeStyle = 'rgba(180,200,255,0.35)'; ctx.lineWidth = 1;
    for (let i = 0; i < 40; i++) {
      const x = (i * 53 + t * 260) % CONFIG.GAME_W;
      const y = (i * 97 + t * 380) % CONFIG.GAME_H;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 3, y + 9); ctx.stroke();
    }
  } else if (region === 'mountain') {
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    for (let i = 0; i < 50; i++) {
      const x = (i * 61 + Math.sin(t + i) * 20) % CONFIG.GAME_W;
      const y = (i * 71 + t * 60) % CONFIG.GAME_H;
      ctx.fillRect(x, y, 2, 2);
    }
  } else if (region === 'desert') {
    ctx.fillStyle = 'rgba(220,190,110,0.12)';
    ctx.fillRect(0, 0, CONFIG.GAME_W, CONFIG.GAME_H);
    ctx.fillStyle = 'rgba(220,190,110,0.3)';
    for (let i = 0; i < 30; i++) {
      const x = (i * 83 + t * 300) % CONFIG.GAME_W;
      const y = (i * 41) % CONFIG.GAME_H;
      ctx.fillRect(x, y, 6, 1);
    }
  } else if (region === 'darkness') {
    ctx.fillStyle = 'rgba(0,0,10,0.28)';
    ctx.fillRect(0, 0, CONFIG.GAME_W, CONFIG.GAME_H);
  }
}

function drawBush(x, y) {
  const sway = Math.sin(performance.now() / 500 + x) * 1.2;
  ctx.fillStyle = '#245a20';
  ctx.beginPath(); ctx.ellipse(x + sway, y - 2, 7, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#357a30';
  ctx.beginPath(); ctx.ellipse(x - 3 + sway, y - 4, 4, 4, 0, 0, Math.PI * 2); ctx.fill();
}

function drawPot(x, y) {
  ctx.fillStyle = '#000'; ctx.globalAlpha = 0.2;
  ctx.beginPath(); ctx.ellipse(x, y + 6, 6, 2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#b06a3a';
  ctx.beginPath(); ctx.moveTo(x - 6, y - 6); ctx.lineTo(x + 6, y - 6); ctx.lineTo(x + 5, y + 6); ctx.lineTo(x - 5, y + 6); ctx.fill();
  ctx.fillStyle = '#8a4e28';
  ctx.fillRect(x - 6, y - 8, 12, 3);
}

const ENEMY_COLORS = { wolf: '#8a6a4a', fireImp: '#e05a2a', octorok: '#3a7a9a', wraith: '#5a3a7a' };
function drawEnemy(e) {
  ctx.save();
  if (e.hitFlash > 0) {
    ctx.filter = 'brightness(2)';
    const squash = e.hitFlash / 0.1; // squash-stretch pop on hit
    ctx.translate(e.x, e.y); ctx.scale(1 + squash * 0.25, 1 - squash * 0.2); ctx.translate(-e.x, -e.y);
  }
  const scale = e.isMiniboss ? 1.8 : 1;
  if (e.type === 'slime') {
    ctx.fillStyle = '#3fc766';
    ctx.beginPath(); ctx.ellipse(e.x, e.y, 7 * scale, 6 * scale, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#20211a';
    ctx.fillRect(e.x - 3, e.y - 2, 2, 2); ctx.fillRect(e.x + 1, e.y - 2, 2, 2);
  } else if (e.type === 'bat') {
    ctx.fillStyle = '#6a4a9a';
    ctx.beginPath(); ctx.ellipse(e.x, e.y, 6, 4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(e.x - 6, e.y); ctx.lineTo(e.x - 11, e.y - 4); ctx.lineTo(e.x - 6, e.y - 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(e.x + 6, e.y); ctx.lineTo(e.x + 11, e.y - 4); ctx.lineTo(e.x + 6, e.y - 2); ctx.fill();
  } else {
    // dungeon enemies: wolf/fireImp/octorok/wraith - distinct silhouette per type
    const c = ENEMY_COLORS[e.type] || '#aaaaaa';
    ctx.fillStyle = c;
    ctx.beginPath(); ctx.ellipse(e.x, e.y, 7 * scale, 6 * scale, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    if (e.type === 'wolf') { ctx.fillRect(e.x - 8 * scale, e.y - 6 * scale, 3, 3); ctx.fillRect(e.x + 5 * scale, e.y - 6 * scale, 3, 3); }
    else if (e.type === 'fireImp') { ctx.fillStyle = '#ffd84a'; ctx.beginPath(); ctx.arc(e.x, e.y - 8 * scale, 3, 0, Math.PI * 2); ctx.fill(); }
    else if (e.type === 'octorok') { ctx.fillStyle = '#1a4a5a'; ctx.fillRect(e.x - 4, e.y + 4, 8, 3); }
    else if (e.type === 'wraith') { ctx.globalAlpha = 0.75; }
    if (e.tribute) { ctx.fillStyle = '#ffd84a'; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center'; ctx.fillText('*', e.x, e.y - 12); }
  }
  if (e.type === 'ganon') drawGanon(e);
  ctx.restore();
  // small HP bar for damaged enemies
  if (e.hp < e.maxHp) {
    ctx.fillStyle = '#000'; ctx.fillRect(e.x - 8, e.y - 14, 16, 3);
    ctx.fillStyle = '#e03030'; ctx.fillRect(e.x - 8, e.y - 14, 16 * (e.hp / e.maxHp), 3);
  }
}

function drawGanon(g) {
  const flash = g.telegraph > 0 && Math.floor(g.telegraph * 10) % 2 === 0;
  ctx.fillStyle = flash ? '#ffffff' : '#2a1a2a';
  ctx.fillRect(g.x - 18, g.y - 22, 36, 40);
  ctx.fillStyle = flash ? '#ffcccc' : '#7a1a1a';
  ctx.fillRect(g.x - 16, g.y - 20, 32, 10); // cape/armor trim
  ctx.fillStyle = '#e8b888';
  ctx.fillRect(g.x - 6, g.y - 32, 12, 10); // head
  ctx.fillStyle = '#b02020';
  ctx.fillRect(g.x - 7, g.y - 36, 14, 6); // red hair
  ctx.fillStyle = '#111';
  ctx.fillRect(g.x - 4, g.y - 28, 2, 2); ctx.fillRect(g.x + 2, g.y - 28, 2, 2);
  for (const p of g.projectiles) {
    ctx.fillStyle = '#c060ff';
    ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI * 2); ctx.fill();
  }
}

function drawBossHPBar(g) {
  const w = 400, h = 16, x = CONFIG.GAME_W / 2 - w / 2, y = 14;
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x - 4, y - 20, w + 8, h + 30);
  ctx.fillStyle = '#ffd84a'; ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center';
  ctx.fillText('GANONDORF - Phase ' + g.phase, CONFIG.GAME_W / 2, y - 6);
  ctx.fillStyle = '#3a0a0a'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = g.phase === 3 ? '#ff8020' : g.phase === 2 ? '#c020c0' : '#e02020';
  ctx.fillRect(x, y, w * Math.max(0, g.hp / g.maxHp), h);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
}

function drawDungeonExtras(d) {
  const p = d.puzzle;
  if (d.roomIndex === 1 && p) {
    if (p.type === 'pushblock') {
      ctx.fillStyle = '#8a6a3a';
      ctx.fillRect(p.block.x - 7, p.block.y - 7, 14, 14);
      ctx.strokeStyle = '#5a3a1a'; ctx.strokeRect(p.block.x - 7, p.block.y - 7, 14, 14);
    } else if (p.type === 'torches') {
      p.torches.forEach((t, i) => {
        if (p.lit.includes(i)) {
          const wx = (t.x + 0.5) * CONFIG.TILE, wy = (t.y + 0.5) * CONFIG.TILE - 4;
          ctx.fillStyle = '#ffae42';
          ctx.beginPath(); ctx.ellipse(wx, wy, 4, 7, 0, 0, Math.PI * 2); ctx.fill();
        }
      });
    } else if (p.type === 'switches') {
      p.switches.forEach((s, i) => {
        if (p.stepped.includes(i)) {
          const wx = (s.x + 0.5) * CONFIG.TILE, wy = (s.y + 0.5) * CONFIG.TILE;
          ctx.fillStyle = '#8effc1';
          ctx.beginPath(); ctx.arc(wx, wy, 5, 0, Math.PI * 2); ctx.fill();
        }
      });
    }
  }
  // miniboss HP bar (world space, above the miniboss)
  for (const e of d.enemies[d.roomIndex]) {
    if (e.isMiniboss && e.alive) {
      ctx.fillStyle = '#000'; ctx.fillRect(e.x - 20, e.y - e.h / 2 - 14, 40, 5);
      ctx.fillStyle = '#e03030'; ctx.fillRect(e.x - 20, e.y - e.h / 2 - 14, 40 * (e.hp / e.maxHp), 5);
    }
  }
}

function drawCoin(x, y) {
  ctx.fillStyle = '#ffd84a';
  ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#a87c10'; ctx.lineWidth = 1; ctx.stroke();
}

function drawHeartPickup(x, y, t) {
  const bob = Math.sin(t * 5) * 3;
  ctx.fillStyle = '#ff5a7a';
  const hx = x, hy = y + bob;
  ctx.beginPath();
  ctx.moveTo(hx, hy + 4);
  ctx.bezierCurveTo(hx, hy, hx - 6, hy, hx - 6, hy + 3);
  ctx.bezierCurveTo(hx - 6, hy + 7, hx, hy + 9, hx, hy + 11);
  ctx.bezierCurveTo(hx, hy + 9, hx + 6, hy + 7, hx + 6, hy + 3);
  ctx.bezierCurveTo(hx + 6, hy, hx, hy, hx, hy + 4);
  ctx.fill();
}

function drawSwordArc(x, y, facing, t) {
  const progress = 1 - t / 0.2;
  const baseAngle = { up: -Math.PI / 2, down: Math.PI / 2, left: Math.PI, right: 0 }[facing];
  const sweep = Math.PI * 0.8;
  const ang = baseAngle - sweep / 2 + sweep * progress;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 8;
  ctx.beginPath(); ctx.arc(0, 0, 16, -0.3, 0.3); ctx.stroke();
  ctx.fillStyle = '#d8d8e8';
  ctx.fillRect(4, -2, CONFIG.SWORD_RANGE * 0.7, 4);
  ctx.fillStyle = '#8a6a3a';
  ctx.fillRect(0, -3, 5, 6);
  ctx.restore();
}

function drawMathPopup() {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, CONFIG.GAME_W, CONFIG.GAME_H);
  const bw = 460, bh = 240;
  const bx = CONFIG.GAME_W / 2 - bw / 2, by = 60;
  ctx.fillStyle = '#20304a';
  ctx.strokeStyle = '#ffd84a'; ctx.lineWidth = 3;
  roundRect(bx, by, bw, bh, 14); ctx.fill(); ctx.stroke();

  const tierLabel = mathPopup.purpose === 'revive' ? 'Revive!' : 'Earn Action Points!';
  ctx.fillStyle = '#ffd84a'; ctx.font = 'bold 20px monospace'; ctx.textAlign = 'center';
  ctx.fillText(tierLabel + ' - ' + QUESTION_TIERS[CONFIG.DIFFICULTY].label, CONFIG.GAME_W / 2, by + 34);

  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 28px monospace';
  ctx.fillText(mathPopup.question.questionText, CONFIG.GAME_W / 2, by + 90);

  const btns = getMathButtons();
  const q = mathPopup.question;
  for (let i = 0; i < btns.length; i++) {
    const b = btns[i];
    const isWrong = i === mathPopup.wrongIdx;
    ctx.fillStyle = isWrong ? '#555555' : '#3a5a8a';
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
    roundRect(b.x, b.y, b.w, b.h, 8); ctx.fill(); ctx.stroke();
    ctx.fillStyle = isWrong ? '#999999' : '#ffffff';
    ctx.font = 'bold 22px monospace';
    ctx.fillText(q.answers[i], b.x + b.w / 2, b.y + b.h / 2 + 8);
  }

  ctx.fillStyle = '#cccccc'; ctx.font = '12px monospace';
  if (mathPopup.wrongIdx >= 0) {
    ctx.fillStyle = '#ffb3b3';
    ctx.fillText('Good try! Have another go!', CONFIG.GAME_W / 2, by + bh - 14);
  } else if (mathPopup.purpose === 'ap') {
    ctx.fillText('Tap an answer, or press 1/2/3    (ESC/X to close)', CONFIG.GAME_W / 2, by + bh - 14);
  } else {
    ctx.fillText('Answer to revive your hero!', CONFIG.GAME_W / 2, by + bh - 14);
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawHUD() {
  ctx.fillStyle = '#000'; ctx.globalAlpha = 0.35;
  ctx.fillRect(4, 4, 220, 56); ctx.globalAlpha = 1;

  // hearts (real, tracks player.hearts/maxHearts)
  for (let i = 0; i < player.maxHearts; i++) {
    const hx = 16 + i * 18, hy = 14;
    const filled = i < player.hearts;
    ctx.fillStyle = filled ? '#d94f4f' : '#4a2020';
    ctx.beginPath();
    ctx.moveTo(hx, hy + 3);
    ctx.bezierCurveTo(hx, hy, hx - 6, hy, hx - 6, hy + 4);
    ctx.bezierCurveTo(hx - 6, hy + 8, hx, hy + 10, hx, hy + 12);
    ctx.bezierCurveTo(hx, hy + 10, hx + 6, hy + 8, hx + 6, hy + 4);
    ctx.bezierCurveTo(hx + 6, hy, hx, hy, hx, hy + 3);
    ctx.fill();
  }

  // AP bar: 10 segments under hearts
  const apX = 10, apY = 28, segW = 18, segH = 10, segGap = 2;
  for (let i = 0; i < player.maxAp; i++) {
    const filled = i < player.ap;
    ctx.fillStyle = filled ? '#4fc3ff' : '#1a2a3a';
    ctx.fillRect(apX + i * (segW + segGap), apY, segW, segH);
    ctx.strokeStyle = '#0a1420'; ctx.lineWidth = 1;
    ctx.strokeRect(apX + i * (segW + segGap), apY, segW, segH);
  }

  ctx.fillStyle = '#ffd84a'; ctx.font = 'bold 13px monospace'; ctx.textAlign = 'left';
  ctx.fillText('Gold: ' + hud.gold, 10, 52);

  // medallion icons
  const medOrder = ['forest', 'fire', 'water', 'shadow'];
  const medColors = { forest: '#3fc766', fire: '#e05a2a', water: '#3a8ac9', shadow: '#7a4aa0' };
  medOrder.forEach((k, i) => {
    const mx = 150 + i * 16, my = 44;
    ctx.fillStyle = player.medallions[k] ? medColors[k] : '#333';
    ctx.beginPath(); ctx.arc(mx, my, 6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
  });
}

function drawXPBar() {
  const x = 10, y = 62, w = 200, h = 6;
  ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(x - 4, y - 4, w + 8, h + 20);
  ctx.fillStyle = '#1a2a1a'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#8effc1'; ctx.fillRect(x, y, w * (player.xp / player.xpToNext), h);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'left';
  ctx.fillText('Lv ' + player.level, x, y + 18);
}

// =========================================================================
// Wardrobe (Phase 6): P key or HUD button, blocking pause, tap to preview
// and apply a skin everywhere (hero sprite + slot icons) immediately.
// =========================================================================
const wardrobe = { active: false };
function openWardrobe() { wardrobe.active = true; }
function closeWardrobe() { wardrobe.active = false; }
function wardrobeButtonRect() { return { x: CONFIG.GAME_W - 68, y: CONFIG.GAME_H - 34, w: 28, h: 28 }; }
function tapWardrobeButton(sx, sy) { return pointInRect(sx, sy, wardrobeButtonRect()); }
function drawWardrobeButton() {
  const r = wardrobeButtonRect();
  ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.fillStyle = currentTunic().body; ctx.fillRect(r.x + 6, r.y + 6, 16, 16);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.strokeRect(r.x, r.y, r.w, r.h);
}
function getWardrobeSwatches() {
  const keys = Object.keys(TUNIC_SKINS);
  const size = 70, gap = 14, cols = 3;
  const totalW = cols * size + (cols - 1) * gap;
  const startX = CONFIG.GAME_W / 2 - totalW / 2, startY = 90;
  return keys.map((k, i) => ({
    key: k, x: startX + (i % cols) * (size + gap), y: startY + Math.floor(i / cols) * (size + gap), w: size, h: size,
  }));
}
function updateWardrobeInput() {
  if (Input.keys['p'] || Input.keys['P'] || Input.keys['Escape']) {
    Input.keys['p'] = Input.keys['P'] = Input.keys['Escape'] = false;
    closeWardrobe(); return;
  }
  if (Input.tapped) {
    const wp = { x: Input.tapX, y: Input.tapY };
    if (pointInRect(wp.x, wp.y, { x: CONFIG.GAME_W - 40, y: 10, w: 30, h: 30 })) { closeWardrobe(); Input.tapped = false; return; }
    for (const sw of getWardrobeSwatches()) {
      if (pointInRect(wp.x, wp.y, sw)) {
        if (player.unlockedSkins[sw.key]) { player.skin = sw.key; SFX.coin(1); }
        else showHint('Not unlocked yet!', 1.2);
        break;
      }
    }
    Input.tapped = false;
  }
}
function drawWardrobe() {
  ctx.fillStyle = 'rgba(10,10,20,0.92)'; ctx.fillRect(0, 0, CONFIG.GAME_W, CONFIG.GAME_H);
  ctx.fillStyle = '#ffd84a'; ctx.font = 'bold 20px monospace'; ctx.textAlign = 'center';
  ctx.fillText('WARDROBE', CONFIG.GAME_W / 2, 40);
  ctx.fillStyle = '#fff'; ctx.font = '11px monospace';
  ctx.fillText('Tap a tunic to wear it - P/ESC to close', CONFIG.GAME_W / 2, 58);
  for (const sw of getWardrobeSwatches()) {
    const tunic = TUNIC_SKINS[sw.key];
    const unlocked = player.unlockedSkins[sw.key];
    ctx.fillStyle = unlocked ? '#25314a' : '#1a1a1a';
    ctx.fillRect(sw.x, sw.y, sw.w, sw.h);
    ctx.strokeStyle = sw.key === player.skin ? '#ffd84a' : '#4a5a7a';
    ctx.lineWidth = sw.key === player.skin ? 3 : 1;
    ctx.strokeRect(sw.x, sw.y, sw.w, sw.h);
    ctx.fillStyle = unlocked ? tunic.body : '#333';
    ctx.fillRect(sw.x + sw.w / 2 - 10, sw.y + 14, 20, 24);
    ctx.fillStyle = '#fff'; ctx.font = '10px monospace';
    ctx.fillText(unlocked ? tunic.name : 'Locked', sw.x + sw.w / 2, sw.y + sw.h - 8);
  }
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = 'bold 16px monospace';
  ctx.fillText('X', CONFIG.GAME_W - 25, 30);
}

function cycleArrowType() {
  const avail = ['normal'];
  if (player.owned.fireArrow) avail.push('fire');
  if (player.owned.iceArrow) avail.push('ice');
  const idx = avail.indexOf(player.arrowType);
  player.arrowType = avail[(idx + 1) % avail.length];
  showHint('Arrow: ' + player.arrowType, 1.2);
}
function tapWeaponSlot(sx, sy) {
  const slotSize = 48, gap = 6, startX = CONFIG.GAME_W - (slotSize + gap) * 3 - 10, y = CONFIG.GAME_H - slotSize - 10;
  for (let i = 0; i < 3; i++) {
    const x = startX + i * (slotSize + gap);
    if (pointInRect(sx, sy, { x, y, w: slotSize, h: slotSize })) {
      if (player.slots[i] === 'bow' && player.activeSlot === i) cycleArrowType();
      else if (player.slots[i]) player.activeSlot = i;
      return true;
    }
  }
  return false;
}

function drawWeaponSlots() {
  const slotSize = 48, gap = 6, startX = CONFIG.GAME_W - (slotSize + gap) * 3 - 10, y = CONFIG.GAME_H - slotSize - 10;
  const icons = { sword: '⚔', sharpSword: '⚔', heroSword: '⚔', boomerang: '⟳', galeBoomerang: '⟳', bow: '➷' };
  const apCosts = { sword: CONFIG.SWORD_AP_COST, sharpSword: CONFIG.SWORD_AP_COST, heroSword: CONFIG.SWORD_AP_COST,
    boomerang: CONFIG.BOOMERANG_AP_COST, galeBoomerang: CONFIG.BOOMERANG_AP_COST, bow: 1 };
  for (let i = 0; i < 3; i++) {
    const x = startX + i * (slotSize + gap);
    const w = player.slots[i];
    ctx.fillStyle = i === player.activeSlot ? '#3a5a8a' : '#1a2436';
    ctx.strokeStyle = '#fff'; ctx.lineWidth = i === player.activeSlot ? 3 : 1;
    ctx.fillRect(x, y, slotSize, slotSize); ctx.strokeRect(x, y, slotSize, slotSize);
    if (w) {
      ctx.fillStyle = '#ffe066'; ctx.font = 'bold 22px monospace'; ctx.textAlign = 'center';
      ctx.fillText(icons[w] || '?', x + slotSize / 2, y + slotSize / 2 + 8);
      ctx.fillStyle = '#8effc1'; ctx.font = '9px monospace';
      ctx.fillText(apCosts[w] + ' AP', x + slotSize / 2, y + slotSize - 4);
    } else {
      ctx.fillStyle = '#555'; ctx.font = 'bold 18px monospace'; ctx.textAlign = 'center';
      ctx.fillText('🔒', x + slotSize / 2, y + slotSize / 2 + 6);
    }
    ctx.fillStyle = '#ccc'; ctx.font = '9px monospace';
    ctx.fillText(String(i + 1), x + 6, y + 10);
  }
}

function drawDialogueBox() {
  const boxH = 90;
  ctx.fillStyle = 'rgba(15,15,30,0.92)';
  ctx.fillRect(20, CONFIG.GAME_H - boxH - 16, CONFIG.GAME_W - 40, boxH);
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
  ctx.strokeRect(20, CONFIG.GAME_H - boxH - 16, CONFIG.GAME_W - 40, boxH);

  ctx.fillStyle = '#ffd84a'; ctx.font = 'bold 14px monospace'; ctx.textAlign = 'left';
  ctx.fillText(dialogue.npc.name, 34, CONFIG.GAME_H - boxH + 4);

  ctx.fillStyle = '#ffffff'; ctx.font = '14px monospace';
  const line = dialogue.npc.lines[dialogue.lineIndex] || '';
  ctx.fillText(line, 34, CONFIG.GAME_H - boxH + 32);

  ctx.fillStyle = '#aaaaaa'; ctx.font = '11px monospace'; ctx.textAlign = 'right';
  ctx.fillText('E / Enter / tap to continue', CONFIG.GAME_W - 34, CONFIG.GAME_H - 24);
}

// =========================================================================
// Fixed-timestep main loop
// =========================================================================
let lastTime = performance.now();
let accumulator = 0;

function loop(now) {
  let frameTime = now - lastTime;
  lastTime = now;
  if (frameTime > 250) frameTime = 250; // avoid spiral of death on tab-away
  accumulator += frameTime;

  while (accumulator >= CONFIG.STEP_MS) {
    update(CONFIG.STEP_MS);
    accumulator -= CONFIG.STEP_MS;
  }

  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

</script>
