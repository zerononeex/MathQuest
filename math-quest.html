<script>
'use strict';

// =========================================================================
// === PARENT SETTINGS ===
// This is where every "tuning knob" for the game lives. Change a number
// here to make the game easier/harder/faster for your kid. Plain-English
// comments explain what each one does.
// =========================================================================
const CONFIG = {
  // --- Screen / rendering ---
  GAME_W: 640,           // internal game width in pixels (native canvas resolution)
  GAME_H: 360,           // internal game height in pixels
  TILE: 16,               // size of one world tile in pixels

  // --- Difficulty / math tiers ---
  // Which tier is selected by default on the title screen.
  DIFFICULTY: 'ADVENTURER', // one of: LITTLE_HERO, ADVENTURER, MASTER, LEGEND

  // --- Hero movement ---
  HERO_SPEED: 100,        // pixels per second the hero walks
  DUST_STEP_INTERVAL: 0.28, // seconds between dust puffs while walking

  // --- World size ---
  // Phase 1 starter map was 64x44 = 2816 tiles. Phase 8 grows this ~10x by
  // TILE COUNT (bug registry #7: "10x bigger" means 10x tile count, not
  // 10x pixel dimensions): 200x140 = 28000 tiles = 9.94x the original.
  // Both pixel dimensions (200*16=3200, 140*16=2240) stay under the ~4096px
  // single-canvas limit, so the overworld still uses one prerendered
  // canvas (bug registry #3's chunking only kicks in above that).
  MAP_W: 200,              // tiles wide (was 64)
  MAP_H: 140,              // tiles tall (was 44)

  // --- NPCs ---
  NPC_WANDER_SPEED: 30,     // px/s for wandering villagers
  NPC_TALK_RANGE: 22,       // px distance to allow E-to-talk

  // --- Combat / AP ---
  STARTING_AP: 5,           // Action Points the hero starts with
  MAX_AP: 10,                // AP bar cap
  SWORD_AP_COST: 1,          // AP spent per sword swing
  BOOMERANG_AP_COST: 2,      // AP spent per boomerang throw
  SWORD_COOLDOWN: 0.35,      // seconds between sword swings
  SWORD_RANGE: 28,           // px - sword only works this close
  ENEMY_TAP_HITBOX_MULT: 1.5, // forgiving tap hitbox multiplier for enemies
  ENEMY_TAP_HITBOX_MIN: 48,   // minimum forgiving tap hitbox in px

  // --- Math popup tiers ---
  // grade band, AP reward per correct answer
  AP_PER_CORRECT: { LITTLE_HERO: 3, ADVENTURER: 4, MASTER: 5, LEGEND: 6 },
  // chance (0-1) a defeated enemy drops a healing heart, per tier
  HEART_DROP_CHANCE: { LITTLE_HERO: 0.35, ADVENTURER: 0.25, MASTER: 0.18, LEGEND: 0.12 },

  // --- Gear / XP (Phase 3) ---
  STARTING_ATTACK: 1,        // hero's base attack stat
  XP_PER_LEVEL: 20,          // XP needed per level (flat; simple & predictable for kids)
  XP_SLIME: 5, XP_BAT: 8, XP_MINIBOSS: 50,
  WEAPON_REACH_TILES: { sword: 1, sharpSword: 1.1, heroSword: 1.5 }, // sword reach in tiles

  // --- Music (Phase 6) ---
  MUSIC_VOLUME: 0.05,  // quiet background chiptune volume so SFX stays audible
  MUSIC_TEMPO: 1.0,     // 1.0 = normal speed; >1 faster, <1 slower

  // --- Castle finale (Phase 5) ---
  GANON_MAX_HP: 60,           // total HP across all 3 phases
  GANON_PHASE2_HP_FRAC: 0.66, // HP fraction where phase 2 begins
  GANON_PHASE3_HP_FRAC: 0.33, // HP fraction where phase 3 begins
  GANON_ATTACK_INTERVAL: 2.2, // seconds between telegraphed attacks (phase 1/2)
  GANON_SIPHON_INTERVAL: 20,  // seconds between Dark Siphon AP-steal attacks
  GANON_SIPHON_AP: 3,         // AP stolen per Dark Siphon

  // --- Shop item prices (gold) ---
  SHOP: {
    sharpSword: 30, boomerang: 50, heroSword: 150, bow: 120,
    fireArrow: 40, iceArrow: 40, galeBoomerang: 100, heartContainer: 100,
    bigBombBag: 80, superMushroom: 40, fireFlower: 60, dkBarrel: 30, inkBlaster: 90,
  },

  // --- Fixed timestep ---
  STEP_MS: 1000 / 60,     // physics update runs at 60hz regardless of screen fps

  // --- Question category ---
  // Which category of question the Q popup asks. Today only 'math' exists;
  // see QUESTION_BANK below for how to add more (e.g. spelling, geometry)
  // without touching any popup/game logic.
  ACTIVE_CATEGORY: 'math',
};

// =========================================================================
// QUESTION BANK
// One entry per category. Each category needs only a label and a
// generateQuestion(tier) function returning
// { questionText, answers: [a,b,c], correctIndex }.
// Adding a new category (see NOTES near the bottom of this file for the
// exact prompt) never requires touching the math popup or game logic -
// just add a new key here and flip CONFIG.ACTIVE_CATEGORY.
// =========================================================================
function shuffle3(correct, wrongA, wrongB) {
  const arr = [{ v: correct, correct: true }, { v: wrongA, correct: false }, { v: wrongB, correct: false }];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return { answers: arr.map(a => String(a.v)), correctIndex: arr.findIndex(a => a.correct) };
}
function plausibleWrongs(correct, spread) {
  let a = correct + (Math.floor(Math.random() * spread) + 1) * (Math.random() < 0.5 ? -1 : 1);
  let b = correct + (Math.floor(Math.random() * spread) + 1) * (Math.random() < 0.5 ? -1 : 1);
  if (a < 0) a = correct + Math.abs(a) + 1;
  if (b < 0) b = correct + Math.abs(b) + 1;
  if (a === correct) a += 1;
  if (b === correct || b === a) b = a + 1;
  return [a, b];
}

const QUESTION_BANK = {
  math: {
    label: 'Math',
    generateQuestion(tier) {
      let a, b, op, text, correct;
      const r = (n) => 1 + Math.floor(Math.random() * n);
      if (tier === 'LITTLE_HERO') {
        // grades 1-2: addition/subtraction within 20, never negative
        op = Math.random() < 0.5 ? '+' : '-';
        if (op === '+') { a = r(10); b = r(10); correct = a + b; }
        else { a = r(10) + 5; b = r(a); correct = a - b; }
      } else if (tier === 'ADVENTURER') {
        // grades 3-4: multiplication/division + bigger add/sub
        const ops = ['+', '-', '*'];
        op = ops[Math.floor(Math.random() * ops.length)];
        if (op === '+') { a = r(50) + 10; b = r(50) + 10; correct = a + b; }
        else if (op === '-') { a = r(60) + 20; b = r(a); correct = a - b; }
        else { a = r(9) + 1; b = r(9) + 1; correct = a * b; }
      } else if (tier === 'MASTER') {
        // grades 5-6: multiplication/division with larger numbers
        const ops = ['*', '/', '+'];
        op = ops[Math.floor(Math.random() * ops.length)];
        if (op === '*') { a = r(12) + 2; b = r(12) + 2; correct = a * b; }
        else if (op === '/') { b = r(11) + 2; correct = r(11) + 1; a = b * correct; }
        else { a = r(400) + 50; b = r(400) + 50; correct = a + b; }
      } else { // LEGEND: grades 7+: mix incl. simple exponents/two-step
        const ops = ['*', '/', '^', '2step'];
        op = ops[Math.floor(Math.random() * ops.length)];
        if (op === '*') { a = r(20) + 5; b = r(20) + 5; correct = a * b; }
        else if (op === '/') { b = r(15) + 2; correct = r(15) + 2; a = b * correct; }
        else if (op === '^') { a = r(5) + 2; b = 2; correct = Math.pow(a, b); }
        else { a = r(12) + 2; b = r(12) + 2; const c = r(10) + 1; correct = a * b + c; text = `${a} x ${b} + ${c} = ?`; }
      }
      if (!text) {
        const opSym = op === '*' ? 'x' : op === '/' ? '÷' : op === '^' ? '^' : op;
        text = `${a} ${opSym} ${b} = ?`;
      }
      const spread = tier === 'LITTLE_HERO' ? 3 : tier === 'ADVENTURER' ? 6 : tier === 'MASTER' ? 10 : 15;
      const [w1, w2] = plausibleWrongs(correct, spread);
      const shuffled = shuffle3(correct, w1, w2);
      return { questionText: text, answers: shuffled.answers, correctIndex: shuffled.correctIndex };
    },
  },
};

// =========================================================================
// Canvas setup: crisp whole-pixel scaling to fill the screen in any orientation
// =========================================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

canvas.width = CONFIG.GAME_W;
canvas.height = CONFIG.GAME_H;

function resizeCanvas() {
  const stage = document.getElementById('stage');
  const availW = stage.clientWidth;
  const availH = stage.clientHeight;
  // whole-pixel integer scale so pixel art stays crisp; fall back to a
  // fractional scale only if the screen is smaller than the game itself.
  let scale = Math.min(availW / CONFIG.GAME_W, availH / CONFIG.GAME_H);
  if (scale >= 1) scale = Math.floor(scale);
  if (scale <= 0) scale = availW / CONFIG.GAME_W < availH / CONFIG.GAME_H
    ? availW / CONFIG.GAME_W : availH / CONFIG.GAME_H;
  canvas.style.width = (CONFIG.GAME_W * scale) + 'px';
  canvas.style.height = (CONFIG.GAME_H * scale) + 'px';
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 50));
resizeCanvas();

// prevent iOS Safari rubber-band scroll / pinch zoom
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());

// =========================================================================
// WebAudio unlock on first user gesture (required by iPad Safari)
// =========================================================================
let audioCtx = null;
function unlockAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) { /* no audio available */ }
}
window.addEventListener('touchstart', unlockAudio, { once: true });
window.addEventListener('mousedown', unlockAudio, { once: true });
window.addEventListener('keydown', unlockAudio, { once: true });

// simple WebAudio oscillator SFX helper (Phase 2+; more sounds added later)
function playTone(freq, dur, type, gainAmt, startDelay) {
  if (!audioCtx) return;
  try {
    const t0 = audioCtx.currentTime + (startDelay || 0);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(gainAmt || 0.15, t0 + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  } catch (e) { /* ignore */ }
}
const SFX = {
  swish: () => { playTone(520, 0.12, 'triangle', 0.12); playTone(760, 0.08, 'triangle', 0.08, 0.03); },
  hit: () => playTone(140, 0.1, 'square', 0.15),
  thud: () => playTone(100, 0.08, 'square', 0.12),

  wrong: () => playTone(220, 0.18, 'sine', 0.1),

  revive: () => { playTone(392, 0.12, 'triangle', 0.15); playTone(523, 0.12, 'triangle', 0.15, 0.1); playTone(659, 0.2, 'triangle', 0.15, 0.2); },
  boomerangThrow: () => { playTone(300, 0.15, 'sawtooth', 0.08); playTone(500, 0.1, 'sawtooth', 0.06, 0.05); },
  boomerangReturn: () => playTone(600, 0.12, 'sawtooth', 0.1),
  bowTwang: () => playTone(700, 0.08, 'triangle', 0.12),
  fireWhoosh: () => { playTone(150, 0.2, 'sawtooth', 0.1); playTone(400, 0.1, 'sawtooth', 0.05, 0.05); },
  iceChime: () => { playTone(1200, 0.1, 'sine', 0.1); playTone(1500, 0.08, 'sine', 0.08, 0.05); },
  bombFuse: () => playTone(900, 0.05, 'square', 0.05),
  bombExplode: () => { playTone(80, 0.3, 'sawtooth', 0.2); playTone(60, 0.25, 'square', 0.15, 0.05); },
  barrelRoll: () => playTone(120, 0.4, 'sawtooth', 0.08),
  inkSplat: () => playTone(250, 0.12, 'sawtooth', 0.1),
  levelUp: () => { [523, 659, 784, 1046].forEach((f, i) => playTone(f, 0.14, 'triangle', 0.15, i * 0.08)); },
  medallion: () => { [660, 880, 1100].forEach((f, i) => playTone(f, 0.2, 'triangle', 0.15, i * 0.12)); },
  chestFanfare: () => { [523, 659, 784].forEach((f, i) => playTone(f, 0.18, 'square', 0.15, i * 0.1)); },
  victoryMelody: () => { [523, 659, 784, 1046, 784, 1046].forEach((f, i) => playTone(f, 0.22, 'triangle', 0.16, i * 0.18)); },
  ganonLaugh: () => { for (let i = 0; i < 4; i++) playTone(90 - i * 6, 0.18, 'sawtooth', 0.12, i * 0.12); },
};

// simple mute toggle (M key or HUD speaker icon)
const audioSettings = { muted: false };
const _playTone = playTone;
playTone = function (freq, dur, type, gainAmt, startDelay) {
  if (audioSettings.muted) return;
  _playTone(freq, dur, type, gainAmt, startDelay);
};

// =========================================================================

// bass, as [note, durationBeats] arrays. Never copies real melodies.

const NOTE_FREQ = { C4: 261.6, D4: 293.7, E4: 329.6, F4: 349.2, G4: 392.0, A4: 440.0, B4: 493.9,
  C5: 523.3, D5: 587.3, E5: 659.3, F5: 698.5, G5: 784.0, A5: 880.0,

const MUSIC_TRACKS = {

    bass: [['C3', 2], ['F3', 2], ['G3', 2], ['C3', 2]],
  },

  },

const music = { track: null, beatIndex: 0, leadTimer: 0, bassLeadTimer: 0, area: null };
function setMusicArea(area) {
  if (music.area === area) return;
  music.area = area;
  music.track = MUSIC_TRACKS[area] || null;
  music.leadIndex = 0; music.bassIndex = 0;
  music.leadTimer = 0; music.bassTimer = 0;
}
function beatSeconds() { return 0.35 / CONFIG.MUSIC_TEMPO; }
function updateMusic(dt) {
  if (!music.track || audioSettings.muted) return;
  music.leadTimer -= dt;
  if (music.leadTimer <= 0) {
    const [note, beats] = music.track.lead[music.leadIndex % music.track.lead.length];
    music.leadIndex++;
    music.leadTimer = beats * beatSeconds();
    if (note !== 'REST') playTone(NOTE_FREQ[note], beats * beatSeconds() * 0.9, 'square', CONFIG.MUSIC_VOLUME);
  }
  music.bassTimer -= dt;
  if (music.bassTimer <= 0) {
    const [note, beats] = music.track.bass[music.bassIndex % music.track.bass.length];
    music.bassIndex++;
    music.bassTimer = beats * beatSeconds();
    if (note !== 'REST') playTone(NOTE_FREQ[note], beats * beatSeconds() * 0.9, 'triangle', CONFIG.MUSIC_VOLUME * 1.3);
  }
}
function musicAreaForWorld() {
  if (gameState === STATE.TITLE) return 'title';
  if (gameState === STATE.VICTORY) return 'victory';
  if (world.mode === 'dungeon') return 'dungeon';
  if (world.mode === 'castle') return 'boss';
  return 'overworld';
}

const Input = {

};
window.addEventListener('keydown', e => { Input.keys[e.key] = true; });
window.addEventListener('keyup', e => { Input.keys[e.key] = false; });

function canvasToGameCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = CONFIG.GAME_W / rect.width;
  const scaleY = CONFIG.GAME_H / rect.height;
  return {
    x: (clientX - rect.left) * scaleX,
    y: (clientY - rect.top) * scaleY,
  };
}

canvas.addEventListener('touchstart', e => {
  const t = e.changedTouches[0];
  const p = canvasToGameCoords(t.clientX, t.clientY);
  Input.tapX = p.x; Input.tapY = p.y; Input.tapped = true;
  Input.swipeStartX = p.x; Input.swipeStartY = p.y;
}, { passive: false });
canvas.addEventListener('touchend', e => {
  const t = e.changedTouches[0];
  const p = canvasToGameCoords(t.clientX, t.clientY);
  if (Input.swipeStartX !== undefined) {
    const dx = p.x - Input.swipeStartX, dy = p.y - Input.swipeStartY;
    if (Math.abs(dx) > 24 && Math.abs(dx) > Math.abs(dy) * 2) {
      Input.swipe = { x: Input.swipeStartX, y: Input.swipeStartY, dx };
    }
  }
}, { passive: false });

canvas.addEventListener('mousedown', e => {
  const p = canvasToGameCoords(e.clientX, e.clientY);
  Input.tapX = p.x; Input.tapY = p.y; Input.tapped = true;
});

const T = {
  GRASS: 0, DIRT: 1, WATER: 2, TREE: 3, FLOOR: 4, WALL: 5, DOOR: 6, RUG: 7,
  CHEST: 8, SWITCH: 9, TORCH: 10, LOCKDOOR: 11, BOSSDOOR: 12, STAIRS: 13, SIGNPOST: 14,
  SAND: 15, SNOW: 16, CLIFF: 17, DARKGRASS: 18,
};
const SOLID_TILES = new Set([T.WATER, T.TREE, T.WALL, T.LOCKDOOR, T.BOSSDOOR, T.SIGNPOST, T.CLIFF]);
const heartPieces = []; // giant heart piece pickups: {x,y,t} (declared early so map-build code can spawn into it)

function makeGrid(w, h, fill) {
  const g = new Array(h);
  for (let y = 0; y < h; y++) { g[y] = new Array(w).fill(fill); }
  return g;
}

// simple seeded PRNG so world layout is identical every load
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// =========================================================================
// Overworld map generation
// =========================================================================
// =========================================================================
// Phase 8: five hand-designed regions ring the central start town. Every
// region is produced by the SAME shared builder (paintRegionBase +
// scatterFeature) fed a small per-region definition (palette/landmark/
// seed/dungeon position) - the map is 10x the tiles, not 10x the code.
// =========================================================================
const TOWN_RADIUS = 17; // tiles around map center reserved for the start town
const REGION_ORDER = ['darkness', 'mountain', 'desert', 'lakes', 'forest']; // clockwise from north
const REGION_DEFS = {
  forest: { base: T.GRASS, treeDensity: 0.22, label: 'Forest' },
  mountain: { base: T.CLIFF, treeDensity: 0.03, label: 'Mountain', floorBase: T.GRASS },
  lakes: { base: T.GRASS, treeDensity: 0.06, label: 'Lakes', waterPonds: true },
  desert: { base: T.SAND, treeDensity: 0.01, label: 'Desert' },
  darkness: { base: T.DARKGRASS, treeDensity: 0.14, label: 'Darkness' },
};
function regionAngleIndex(dx, dy) {
  let deg = Math.atan2(dy, dx) * 180 / Math.PI; // 0=east, 90=south
  deg = (deg + 360) % 360;
  // rotate so "north" (dy<0, deg=270) lands at the start of the darkness sector
  const rotated = (deg + 90) % 360; // now 0 = north
  return Math.floor(rotated / 72);
}
function regionAt(tx, ty) {
  const cx = CONFIG.MAP_W / 2, cy = CONFIG.MAP_H / 2;
  const dx = tx - cx, dy = ty - cy;
  const dist = Math.hypot(dx, dy);
  if (dist < TOWN_RADIUS) return 'town';
  return REGION_ORDER[regionAngleIndex(dx, dy)];
}

function drawRoadLine(grid, x0, y0, x1, y1) {
  // simple straight dirt-road stamp between two tile points (shared by
  // every region's road-to-landmark connector)
  const steps = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0));
  for (let i = 0; i <= steps; i++) {
    const t = steps === 0 ? 0 : i / steps;
    const x = Math.round(x0 + (x1 - x0) * t), y = Math.round(y0 + (y1 - y0) * t);
    for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) {
      const gx = x + ox, gy = y + oy;
      if (gx > 1 && gy > 1 && gx < grid[0].length - 2 && gy < grid.length - 2) {
        if (Math.abs(ox) + Math.abs(oy) <= 1) grid[gy][gx] = T.DIRT;
      }
    }
  }
}

function buildOverworld() {
  const w = CONFIG.MAP_W, h = CONFIG.MAP_H;
  const grid = makeGrid(w, h, T.GRASS);
  const rand = mulberry32(1337);
  const cx = Math.floor(w / 2), cy = Math.floor(h / 2);

  // water border ring
  for (let x = 0; x < w; x++) { grid[0][x] = T.WATER; grid[1][x] = T.WATER; grid[h - 1][x] = T.WATER; grid[h - 2][x] = T.WATER; }
  for (let y = 0; y < h; y++) { grid[y][0] = T.WATER; grid[y][1] = T.WATER; grid[y][w - 1] = T.WATER; grid[y][w - 2] = T.WATER; }

  // paint each region's base terrain (shared loop, per-region def picks the tile)
  for (let y = 2; y < h - 2; y++) {
    for (let x = 2; x < w - 2; x++) {
      const r = regionAt(x, y);
      if (r === 'town') continue; // keep the town core as plain grass
      const def = REGION_DEFS[r];
      grid[y][x] = def.base;
    }
  }

  // town streets: a small dirt cross at the map center
  for (let x = cx - TOWN_RADIUS; x < cx + TOWN_RADIUS; x++) { grid[cy][x] = T.DIRT; grid[cy + 1][x] = T.DIRT; }
  for (let y = cy - TOWN_RADIUS; y < cy + TOWN_RADIUS; y++) { grid[y][cx] = T.DIRT; grid[y][cx + 1] = T.DIRT; }

  // per-region scattered features: trees in forest/darkness, rock outcrops
  // in mountain, ponds in lakes, cacti-look sand tufts in desert - all via
  // the same scatter loop, just fed a different density/tile per region.
  for (const rname of REGION_ORDER) {
    const def = REGION_DEFS[rname];
    const count = Math.floor(w * h * 0.02 * def.treeDensity * 6);
    for (let i = 0; i < count; i++) {
      const x = 3 + Math.floor(rand() * (w - 6));
      const y = 3 + Math.floor(rand() * (h - 6));
      if (regionAt(x, y) !== rname) continue;
      if (grid[y][x] === def.base) grid[y][x] = T.TREE;
    }
    if (def.waterPonds) {
      for (let p = 0; p < 5; p++) {
        const px = 3 + Math.floor(rand() * (w - 6)), py = 3 + Math.floor(rand() * (h - 6));
        if (regionAt(px, py) !== rname) continue;
        for (let oy = -2; oy <= 2; oy++) for (let ox = -2; ox <= 2; ox++) {
          const gx = px + ox, gy = py + oy;
          if (gx > 1 && gy > 1 && gx < w - 2 && gy < h - 2 && ox * ox + oy * oy <= 4 && regionAt(gx, gy) === rname) grid[gy][gx] = T.WATER;
        }
      }
    }
  }

  // town-core light scatter of trees for flavor (kept sparse near buildings)
  for (let i = 0; i < 40; i++) {
    const x = 3 + Math.floor(rand() * (w - 6));
    const y = 3 + Math.floor(rand() * (h - 6));
    if (regionAt(x, y) === 'town' && grid[y][x] === T.GRASS) grid[y][x] = T.TREE;
  }

  return { w, h, grid };
}

const overworld = buildOverworld();

// prerendered offscreen canvas for the overworld (Phase1 scale is small
// enough for a single canvas; Phase 8 switches to chunked prerendering).
function prerenderMap(mapData) {
  const off = document.createElement('canvas');
  off.width = mapData.w * CONFIG.TILE;
  off.height = mapData.h * CONFIG.TILE;
  const octx = off.getContext('2d');
  const rand = mulberry32(99);
  for (let y = 0; y < mapData.h; y++) {
    for (let x = 0; x < mapData.w; x++) {
      const t = mapData.grid[y][x];
      const px = x * CONFIG.TILE, py = y * CONFIG.TILE;
      drawTile(octx, t, px, py, rand, mapData, x, y);
    }
  }
  return off;
}

// Phase 7 shared palette accents (art-only; no gameplay/hitbox impact)
const GRASS_SHADES = ['#3f7a33', '#457f37', '#3a7530', '#457c3a'];
function neighborTile(mapData, x, y, dx, dy) {
  const nx = x + dx, ny = y + dy;
  if (!mapData || ny < 0 || ny >= mapData.h || nx < 0 || nx >= mapData.w) return null;
  return mapData.grid[ny][nx];
}
function drawTile(octx, t, px, py, rand, mapData, gx, gy) {
  const TS = CONFIG.TILE;
  switch (t) {
    case T.GRASS: {
      const variant = Math.abs(Math.floor(Math.sin((gx || 0) * 12.9898 + (gy || 0) * 78.233) * 43758.5453)) % GRASS_SHADES.length;
      octx.fillStyle = GRASS_SHADES[variant];
      octx.fillRect(px, py, TS, TS);
      // sparse blade/flower detail, deterministic per-tile
      if (variant === 1) { octx.fillStyle = '#5aa04a'; octx.fillRect(px + 4, py + 10, 2, 4); octx.fillRect(px + 10, py + 6, 2, 4); }
      if (variant === 3) { octx.fillStyle = '#e8d95a'; octx.fillRect(px + 7, py + 8, 2, 2); }
      break;
    }
    case T.DIRT:
      octx.fillStyle = '#a9814f';
      octx.fillRect(px, py, TS, TS);
      octx.fillStyle = '#96703f';
      octx.fillRect(px + 2, py + 6, 3, 2);
      octx.fillStyle = '#8a6535';
      octx.fillRect(px + 10, py + 3, 2, 2); octx.fillRect(px + 6, py + 11, 3, 2);
      break;
    case T.WATER: {
      octx.fillStyle = '#2a5fa0';
      octx.fillRect(px, py, TS, TS);
      octx.fillStyle = '#3f79c2';
      octx.fillRect(px, py + (Math.floor(px / TS) % 2 === 0 ? 3 : 9), TS, 2);
      // foam along any edge touching non-water (simple autotile shoreline)
      octx.fillStyle = 'rgba(255,255,255,0.55)';
      if (neighborTile(mapData, gx, gy, 0, -1) !== T.WATER) octx.fillRect(px, py, TS, 2);
      if (neighborTile(mapData, gx, gy, 0, 1) !== T.WATER) octx.fillRect(px, py + TS - 2, TS, 2);
      if (neighborTile(mapData, gx, gy, -1, 0) !== T.WATER) octx.fillRect(px, py, 2, TS);
      if (neighborTile(mapData, gx, gy, 1, 0) !== T.WATER) octx.fillRect(px + TS - 2, py, 2, TS);
      break;
    }
    case T.TREE: {
      const pine = ((gx || 0) + (gy || 0) * 3) % 3 === 0;
      octx.fillStyle = '#3f7a33';
      octx.fillRect(px, py, TS, TS);
      octx.fillStyle = 'rgba(0,0,0,0.15)';
      octx.beginPath(); octx.ellipse(px + 8, py + 14, 6, 2, 0, 0, Math.PI * 2); octx.fill();
      octx.fillStyle = '#5a3a1e';
      octx.fillRect(px + 6, py + 10, 4, 6);
      if (pine) {
        octx.fillStyle = '#245022';
        octx.beginPath(); octx.moveTo(px + 8, py - 1); octx.lineTo(px + 15, py + 11); octx.lineTo(px + 1, py + 11); octx.fill();
        octx.fillStyle = '#2f6a2a';
        octx.beginPath(); octx.moveTo(px + 8, py + 3); octx.lineTo(px + 14, py + 12); octx.lineTo(px + 2, py + 12); octx.fill();
      } else {
        octx.fillStyle = '#2c5a22';
        octx.beginPath(); octx.arc(px + 8, py + 7, 8, 0, Math.PI * 2); octx.fill();
        octx.fillStyle = '#3d7a30';
        octx.beginPath(); octx.arc(px + 6, py + 5, 4, 0, Math.PI * 2); octx.fill();
      }
      break;
    }
    case T.FLOOR:
      octx.fillStyle = ((gx || 0) + (gy || 0)) % 5 === 0 ? '#cdae7d' : '#c9a876';
      octx.fillRect(px, py, TS, TS);
      octx.strokeStyle = 'rgba(0,0,0,0.06)'; octx.strokeRect(px + 0.5, py + 0.5, TS - 1, TS - 1);
      break;
    case T.WALL:
      octx.fillStyle = '#6b4a2a';
      octx.fillRect(px, py, TS, TS);
      octx.fillStyle = '#543a20';
      octx.fillRect(px, py, TS, 3);
      octx.fillStyle = 'rgba(0,0,0,0.15)';
      octx.fillRect(px, py + TS - 3, TS, 3);
      break;
    case T.RUG:
      octx.fillStyle = '#c9a876';
      octx.fillRect(px, py, TS, TS);
      octx.fillStyle = '#d94f4f';
      octx.fillRect(px + 2, py + 2, TS - 4, TS - 4);
      break;
    case T.CHEST:
      octx.fillStyle = '#c9a876'; octx.fillRect(px, py, TS, TS);
      octx.fillStyle = '#a87830'; octx.fillRect(px + 2, py + 5, TS - 4, TS - 8);
      octx.fillStyle = '#ffd84a'; octx.fillRect(px + 6, py + 8, 4, 3);
      break;
    case T.SWITCH:
      octx.fillStyle = '#c9a876'; octx.fillRect(px, py, TS, TS);
      octx.fillStyle = '#6a6a8a'; octx.beginPath(); octx.arc(px + TS / 2, py + TS / 2, 5, 0, Math.PI * 2); octx.fill();
      break;
    case T.TORCH:
      octx.fillStyle = '#3a3a3a'; octx.fillRect(px, py, TS, TS);
      octx.fillStyle = '#7a5a3a'; octx.fillRect(px + 6, py + 8, 4, 8);
      break;
    case T.LOCKDOOR:
      octx.fillStyle = '#5a4a2a'; octx.fillRect(px, py, TS, TS);
      octx.fillStyle = '#ffd84a'; octx.fillRect(px + 6, py + 6, 4, 4);
      break;
    case T.BOSSDOOR:
      octx.fillStyle = '#3a1a1a'; octx.fillRect(px, py, TS, TS);
      octx.fillStyle = '#8a2a2a'; octx.fillRect(px + 2, py + 2, TS - 4, TS - 4);
      break;
    case T.STAIRS:
      octx.fillStyle = '#8a8a9a'; octx.fillRect(px, py, TS, TS);
      octx.fillStyle = '#5a5a6a'; octx.fillRect(px + 2, py + 2, TS - 4, 4);
      break;
    case T.SAND: {
      octx.fillStyle = ((gx || 0) * 7 + (gy || 0) * 3) % 9 === 0 ? '#e6c878' : '#dcc074';
      octx.fillRect(px, py, TS, TS);
      octx.strokeStyle = 'rgba(150,110,40,0.25)';
      octx.beginPath(); octx.moveTo(px, py + 5); octx.quadraticCurveTo(px + 8, py + 2, px + TS, py + 5); octx.stroke();
      break;
    }
    case T.SNOW:
      octx.fillStyle = '#eef4fa'; octx.fillRect(px, py, TS, TS);
      octx.fillStyle = 'rgba(180,200,220,0.5)'; octx.fillRect(px + 3, py + 9, 4, 2);
      break;
    case T.CLIFF:
      octx.fillStyle = '#8a7a6a'; octx.fillRect(px, py, TS, TS);
      octx.fillStyle = '#6a5a4a'; octx.fillRect(px, py + TS - 4, TS, 4);
      octx.fillStyle = '#9a8a7a'; octx.fillRect(px + 2, py + 2, TS - 4, 3);
      break;
    case T.DARKGRASS:
      octx.fillStyle = ((gx || 0) + (gy || 0)) % 6 === 0 ? '#233020' : '#1c2818';
      octx.fillRect(px, py, TS, TS);
      break;
    case T.SIGNPOST:
      octx.fillStyle = '#3f7a33'; octx.fillRect(px, py, TS, TS);
      octx.fillStyle = '#8a6a3a'; octx.fillRect(px + 7, py + 6, 2, 10);
      octx.fillStyle = '#c9a876'; octx.fillRect(px + 2, py + 3, 12, 6);
      break;
    default:
      octx.fillStyle = '#000';
      octx.fillRect(px, py, TS, TS);
  }
}

let overworldCanvas = prerenderMap(overworld);

// =========================================================================
// Buildings / interiors
// =========================================================================
// Each building has an overworld door zone (tiles), and an interior map.
function buildInterior(labelText) {
  const w = 10, h = 8;
  const grid = makeGrid(w, h, T.FLOOR);
  for (let x = 0; x < w; x++) { grid[0][x] = T.WALL; grid[h - 1][x] = T.WALL; }
  for (let y = 0; y < h; y++) { grid[y][0] = T.WALL; grid[y][w - 1] = T.WALL; }
  // door/exit rug at bottom-center
  grid[h - 2][Math.floor(w / 2)] = T.RUG;
  grid[h - 2][Math.floor(w / 2) - 1] = T.RUG;
  return { w, h, grid, label: labelText, canvas: null,
    exit: { x: Math.floor(w / 2) - 0.5, y: h - 2 } };
}

const houseInterior = buildInterior('House');
const shopInterior = buildInterior('Shop');
houseInterior.canvas = prerenderMap(houseInterior);
shopInterior.canvas = prerenderMap(shopInterior);

const buildings = [
  {
    name: 'house',
    doorTileX: midSafe(overworld.w / 2 - 6), doorTileY: midSafe(overworld.h / 2 - 5),
    interior: houseInterior,
  },
  {
    name: 'shop',
    doorTileX: midSafe(overworld.w / 2 + 6), doorTileY: midSafe(overworld.h / 2 - 5),
    interior: shopInterior,
  },
];
function midSafe(v) { return Math.round(v); }

// carve building footprints into overworld grid (walls + roof look + door)
function carveBuilding(b) {
  const bw = 4, bh = 3;
  const ox = b.doorTileX - 1, oy = b.doorTileY - bh + 1;
  for (let y = 0; y < bh; y++) {
    for (let x = 0; x < bw; x++) {
      const gx = ox + x, gy = oy + y;
      if (gx < 2 || gy < 2 || gx >= overworld.w - 2 || gy >= overworld.h - 2) continue;
      overworld.grid[gy][gx] = T.WALL;
    }
  }
  overworld.grid[b.doorTileY][b.doorTileX] = T.DOOR;
  b.doorZone = { x: b.doorTileX, y: b.doorTileY, w: 1, h: 1 };
  b.activation = { // 2-3 tile activation zone in front of door
    minX: (b.doorTileX - 1) * CONFIG.TILE, maxX: (b.doorTileX + 2) * CONFIG.TILE,
    minY: (b.doorTileY) * CONFIG.TILE, maxY: (b.doorTileY + 1) * CONFIG.TILE,
  };
  b.spawn = { x: (b.doorTileX + 0.5) * CONFIG.TILE, y: (b.doorTileY + 1.5) * CONFIG.TILE };
}
buildings.forEach(carveBuilding);

// =========================================================================
// DUNGEONS (Phase 4)
// Four dungeons, each a short linear chain of rooms:
//   0 entrance (pots hide a small key) -[locked door, needs small key]->
//   1 puzzle room (dungeon-specific mechanic opens the way) ->
//   2 miniboss room (boss-sealed exit until miniboss dies; drop = Boss
//     Key + Giant Heart Piece) ->
//   3 treasure room (chest needs the Boss Key; gives an Elemental
//     Medallion + permanent ability)
// Bug registry #1/#4: every locked/sealed/boss-key door shows a hint
// and never freezes movement. See handleDungeonDoors().
// =========================================================================
function makeRoom(w, h, theme) {
  const grid = makeGrid(w, h, T.FLOOR);
  for (let x = 0; x < w; x++) { grid[0][x] = T.WALL; grid[h - 1][x] = T.WALL; }
  for (let y = 0; y < h; y++) { grid[y][0] = T.WALL; grid[y][w - 1] = T.WALL; }
  return { w, h, grid, canvas: null, theme };
}
function carveDoorGap(room, edge, tileType) {
  const midY = Math.floor(room.h / 2);
  if (edge === 'east') { room.grid[midY][room.w - 1] = tileType; room.grid[midY - 1][room.w - 1] = T.FLOOR; }
  if (edge === 'west') { room.grid[midY][0] = tileType; room.grid[midY - 1][0] = T.FLOOR; }
}

const DUNGEON_DEFS = [
  { id: 'forest', name: 'Forest Dungeon', color: '#2c5a22', enemyType: 'wolf', puzzle: 'pushblock', region: 'forest' },
  { id: 'fire', name: 'Fire Dungeon', color: '#7a2a1a', enemyType: 'fireImp', puzzle: 'torches', region: 'mountain' },
  { id: 'water', name: 'Water Dungeon', color: '#1a3a6a', enemyType: 'octorok', puzzle: 'switches', region: 'lakes' },
  { id: 'shadow', name: 'Shadow Dungeon', color: '#2a1a3a', enemyType: 'wraith', puzzle: 'riddle', region: 'darkness' },
];

function makeDungeonEnemy(kind, x, y) {
  const table = {
    wolf: { w: 14, h: 12, hp: 3, xp: 7, range: 130, speed: 55 },
    fireImp: { w: 13, h: 12, hp: 3, xp: 7, range: 120, speed: 45 },
    octorok: { w: 14, h: 13, hp: 3, xp: 7, range: 100, speed: 0 },
    wraith: { w: 13, h: 13, hp: 3, xp: 7, range: 140, speed: 50 },
  };
  const t = table[kind];
  return { type: kind, x, y, w: t.w, h: t.h, hp: t.hp, maxHp: t.hp, defense: 0, alive: true,
    hitFlash: 0, range: t.range, speed: t.speed, xp: t.xp, hopTimer: Math.random(), hopDx: 0, hopDy: 0, t: Math.random() * 10 };
}

function buildDungeon(def) {
  const RW = 16, RH = 10;
  const entrance = makeRoom(RW, RH, def.color);
  const puzzleRoom = makeRoom(RW, RH, def.color);
  const bossRoom = makeRoom(RW, RH, def.color);
  const treasureRoom = makeRoom(RW, RH, def.color);

  carveDoorGap(entrance, 'west', T.FLOOR);
  carveDoorGap(entrance, 'east', T.LOCKDOOR);
  carveDoorGap(puzzleRoom, 'west', T.FLOOR);
  carveDoorGap(puzzleRoom, 'east', T.WALL); // opens (becomes FLOOR) when puzzle solved
  carveDoorGap(bossRoom, 'west', T.FLOOR);
  carveDoorGap(bossRoom, 'east', T.BOSSDOOR);
  carveDoorGap(treasureRoom, 'west', T.FLOOR);

  // small key hidden in a pot in the entrance room
  const keyPot = { x: 3 * CONFIG.TILE, y: 3 * CONFIG.TILE, alive: true, w: 14, h: 14, holdsSmallKey: true };
  const entrancePots = [
    keyPot,
    { x: 3 * CONFIG.TILE, y: (RH - 3) * CONFIG.TILE, alive: true, w: 14, h: 14 },
    { x: (RW - 4) * CONFIG.TILE, y: 3 * CONFIG.TILE, alive: true, w: 14, h: 14 },
  ];
  const entranceEnemies = [
    makeDungeonEnemy(def.enemyType, (RW / 2) * CONFIG.TILE, (RH / 2) * CONFIG.TILE),
  ];

  // puzzle room contents
  let puzzle;
  if (def.puzzle === 'pushblock') {
    puzzle = { type: 'pushblock', solved: false,
      block: { x: 8 * CONFIG.TILE, y: 5 * CONFIG.TILE },
      switchX: 12, switchY: 5 };
    puzzleRoom.grid[5][12] = T.SWITCH;
  } else if (def.puzzle === 'torches') {
    puzzle = { type: 'torches', solved: false, lit: [], order: [0, 1, 2],
      torches: [{ x: 5, y: 3 }, { x: 8, y: 7 }, { x: 12, y: 3 }] };
    for (const t of puzzle.torches) puzzleRoom.grid[t.y][t.x] = T.TORCH;
  } else if (def.puzzle === 'switches') {
    puzzle = { type: 'switches', solved: false, stepped: [], order: [0, 1, 2],
      switches: [{ x: 4, y: 5 }, { x: 8, y: 3 }, { x: 12, y: 7 }] };
    for (const s of puzzle.switches) puzzleRoom.grid[s.y][s.x] = T.SWITCH;
  } else { // riddle: defeat the two "tribute" enemies among a small group
    puzzle = { type: 'riddle', solved: false };
  }
  const puzzleEnemies = def.puzzle === 'riddle'
    ? [
        Object.assign(makeDungeonEnemy(def.enemyType, 5 * CONFIG.TILE, 5 * CONFIG.TILE), { tribute: true }),
        Object.assign(makeDungeonEnemy(def.enemyType, 11 * CONFIG.TILE, 5 * CONFIG.TILE), { tribute: true }),
        makeDungeonEnemy(def.enemyType, 8 * CONFIG.TILE, 3 * CONFIG.TILE),
      ]
    : [makeDungeonEnemy(def.enemyType, 6 * CONFIG.TILE, 7 * CONFIG.TILE)];

  // miniboss: powered-up enemy with more HP and an extra dash attack
  const miniboss = Object.assign(makeDungeonEnemy(def.enemyType, (RW / 2) * CONFIG.TILE, (RH / 2) * CONFIG.TILE), {
    hp: 12, maxHp: 12, xp: CONFIG.XP_MINIBOSS, isMiniboss: true, dashTimer: 2, w: 22, h: 20,
  });

  // treasure chest tile
  treasureRoom.grid[Math.floor(RH / 2)][Math.floor(RW / 2)] = T.CHEST;

  const dungeon = {
    def, roomIndex: 0,
    rooms: [entrance, puzzleRoom, bossRoom, treasureRoom],
    pots: [entrancePots, [], [], []],
    coins: [], // per-dungeon dropped coins reuse global coins array instead
    enemies: [entranceEnemies, puzzleEnemies, [miniboss], []],
    puzzle,
    hasSmallKey: false,
    hasBossKey: false,
    bossDefeated: false,
    heartPieceGiven: false,
    chestOpened: false,
    entranceZone: null,
    overworldSpawn: null,
    doorHintShown: { locked: false, boss: false, chest: false },
  };
  entrance.canvas = prerenderMap(entrance);
  puzzleRoom.canvas = prerenderMap(puzzleRoom);
  bossRoom.canvas = prerenderMap(bossRoom);
  treasureRoom.canvas = prerenderMap(treasureRoom);
  return dungeon;
}

const dungeons = DUNGEON_DEFS.map(buildDungeon);

// Find a tile at a fixed radius from the map center that falls inside the
// named region (shared by every region's landmark placement - dungeons,
// the castle gate, the second town - so one function serves all of them).
function regionAnchor(regionName, radiusOverride, angleBias) {
  const cx = Math.floor(overworld.w / 2), cy = Math.floor(overworld.h / 2);
  const radius = radiusOverride || Math.min(overworld.w, overworld.h) / 2 - 12;
  for (let a = (angleBias || 0); a < 360 + (angleBias || 0); a += 2) {
    const rad = a * Math.PI / 180;
    const tx = Math.round(cx + Math.cos(rad) * radius);
    const ty = Math.round(cy + Math.sin(rad) * radius);
    if (tx > 4 && ty > 4 && tx < overworld.w - 5 && ty < overworld.h - 5 && regionAt(tx, ty) === regionName) {
      return { x: tx, y: ty };
    }
  }
  return { x: cx, y: cy }; // fallback (should not happen with 5 full sectors)
}
// clear a small walkable pocket around a landmark tile (it may have landed
// on a tree/cliff/pond from the region's scatter pass)
function clearPocket(gx, gy, radius, fillTile) {
  for (let oy = -radius; oy <= radius; oy++) for (let ox = -radius; ox <= radius; ox++) {
    const x = gx + ox, y = gy + oy;
    if (x > 1 && y > 1 && x < overworld.w - 2 && y < overworld.h - 2) overworld.grid[y][x] = fillTile;
  }
}

// place 4 signposted dungeon entrances, one per region, connected to town

const wildsPots = [];
const wildsBushes = [];
const wildsEnemies = [];
(function scatterWilds() {
  const rand = mulberry32(2024);
  const cx = overworld.w / 2, cy = overworld.h / 2;
  const enemyKindByRegion = { forest: 'wolf', mountain: 'fireImp', lakes: 'octorok', desert: 'wraith', darkness: 'wraith' };
  for (let i = 0; i < 260; i++) {
    const tx = 3 + Math.floor(rand() * (overworld.w - 6));
    const ty = 3 + Math.floor(rand() * (overworld.h - 6));
    const r = regionAt(tx, ty);
    if (r === 'town') continue;
    if (SOLID_TILES.has(overworld.grid[ty][tx])) continue;
    const wx = (tx + 0.5) * CONFIG.TILE, wy = (ty + 0.5) * CONFIG.TILE;
    const roll = rand();
    if (roll < 0.35) {
      wildsPots.push({ x: wx, y: wy, alive: true, w: 14, h: 14 });
    } else if (roll < 0.6) {
      wildsBushes.push({ x: wx, y: wy, alive: true, w: 14, h: 14, isBush: true });
    } else if (roll < 0.9) {
      const dist = Math.hypot(tx - cx, ty - cy);
      const tier = Math.min(3, Math.floor(dist / 35)); // gentle scaling with distance from town
      const e = makeDungeonEnemy(enemyKindByRegion[r] || 'wolf', wx, wy);
      e.hp += tier; e.maxHp = e.hp; e.xp += tier * 2;
      wildsEnemies.push(e);
    }
  }

  // secret heart piece: a small clearing deep in the Forest region, walled
  // by trees on every side except one 1-tile gap
  const secretSpot = regionAnchor('forest', Math.min(overworld.w, overworld.h) / 2 - 15, 140);
  const sx = secretSpot.x, sy = secretSpot.y;
  for (let oy = -2; oy <= 2; oy++) for (let ox = -2; ox <= 2; ox++) {
    const gx = sx + ox, gy = sy + oy;
    if (gx > 1 && gy > 1 && gx < overworld.w - 2 && gy < overworld.h - 2) {
      if (Math.abs(ox) === 2 || Math.abs(oy) === 2) overworld.grid[gy][gx] = T.TREE;
      else overworld.grid[gy][gx] = T.GRASS;

  }
  overworld.grid[sy - 2][sx] = T.GRASS; // the single hidden gap north side
  spawnHeartPiece((sx + 0.5) * CONFIG.TILE, (sy + 0.5) * CONFIG.TILE, null);
})();

// solves puzzle-specific interactions; called from updatePlaying each frame
function updateDungeonPuzzle(d, dt) {
  const room = d.rooms[d.roomIndex];
  const p = d.puzzle;
  if (!p || p.solved) return;
  if (d.roomIndex !== 1) return; // puzzle only lives in the puzzle room

  if (p.type === 'pushblock') {
    // push the block if hero walks into it while moving
    const bx = p.block.x, by = p.block.y;
    const d2 = Math.hypot(hero.x - bx, hero.y - by);
    if (d2 < 16 && hero.moving) {
      const dirVec = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }[hero.facing];
      const nbx = bx + dirVec[0] * CONFIG.HERO_SPEED * dt, nby = by + dirVec[1] * CONFIG.HERO_SPEED * dt;
      if (!tileSolidAt(room, nbx, nby)) { p.block.x = nbx; p.block.y = nby; }
    }
    const sx = (p.switchX + 0.5) * CONFIG.TILE, sy = (p.switchY + 0.5) * CONFIG.TILE;
    if (Math.hypot(p.block.x - sx, p.block.y - sy) < 10) solvePuzzle(d, room);
  } else if (p.type === 'torches') {
    for (let i = 0; i < p.torches.length; i++) {
      const t = p.torches[i];
      const wx = (t.x + 0.5) * CONFIG.TILE, wy = (t.y + 0.5) * CONFIG.TILE;
      if (Math.hypot(hero.x - wx, hero.y - wy) < 16 && (Input.keys['e'] || Input.keys['E'])) {
        Input.keys['e'] = Input.keys['E'] = false;
        if (!p.lit.includes(i)) {
          const expectedNext = p.order[p.lit.length];
          if (i === expectedNext) { p.lit.push(i); if (p.lit.length === p.order.length) solvePuzzle(d, room); }
          else { p.lit = []; showHint('The torches went dark... try again!', 1.5); }
        }
      }
    }
  } else if (p.type === 'switches') {
    for (let i = 0; i < p.switches.length; i++) {
      const s = p.switches[i];
      const wx = (s.x + 0.5) * CONFIG.TILE, wy = (s.y + 0.5) * CONFIG.TILE;
      if (Math.hypot(hero.x - wx, hero.y - wy) < 9 && !p.justStepped) {
        if (!p.stepped.includes(i)) {
          const expectedNext = p.order[p.stepped.length];
          if (i === expectedNext) { p.stepped.push(i); p.justStepped = true; if (p.stepped.length === p.order.length) solvePuzzle(d, room); }
          else { p.stepped = []; p.justStepped = true; showHint('The switches reset... try again!', 1.5); }
        }
      }
    }
    if (p.justStepped && !d.puzzle.switches.some((s, i) => Math.hypot(hero.x - (s.x + 0.5) * CONFIG.TILE, hero.y - (s.y + 0.5) * CONFIG.TILE) < 9)) {
      p.justStepped = false;
    }
  } else if (p.type === 'riddle') {
    const tributesAlive = d.enemies[1].filter(e => e.tribute && e.alive).length;
    if (tributesAlive === 0) solvePuzzle(d, room);
  }
}
function solvePuzzle(d, room) {
  d.puzzle.solved = true;
  const midY = Math.floor(room.h / 2);
  room.grid[midY][room.w - 1] = T.FLOOR;
  room.canvas = prerenderMap(room);
  showHint('The way opens!', 1.5);
  SFX.door();
}

// door interactions: locked / boss-sealed / boss-treasure (bug registry #1 #4)
function handleDungeonDoors(d, room, dt) {
  const midY = Math.floor(room.h / 2);
  // small-key locked door (entrance room, east)
  if (d.roomIndex === 0 && room.grid[midY][room.w - 1] === T.LOCKDOOR) {
    const doorX = (room.w - 1) * CONFIG.TILE, doorY = (midY + 0.5) * CONFIG.TILE;
    if (Math.hypot(hero.x - doorX, hero.y - doorY) < 18) {
      if (d.hasSmallKey) {
        room.grid[midY][room.w - 1] = T.FLOOR;
        room.canvas = prerenderMap(room);
        SFX.door();
        showHint('Used a Small Key!', 1.5);
      } else if (!d.doorHintShown.locked) {
        showHint('Locked! Find a small key.', 1.8);
        d.doorHintShown.locked = true;
      }
    } else {
      d.doorHintShown.locked = false;
    }
  }
  // boss-sealed exit (boss room, east) - never freezes, just blocks + hints
  if (d.roomIndex === 2 && room.grid[midY][room.w - 1] === T.BOSSDOOR) {
    const doorX = (room.w - 1) * CONFIG.TILE, doorY = (midY + 0.5) * CONFIG.TILE;
    if (Math.hypot(hero.x - doorX, hero.y - doorY) < 18) {
      if (d.bossDefeated) {
        room.grid[midY][room.w - 1] = T.FLOOR;
        room.canvas = prerenderMap(room);
        SFX.door();
      } else if (!d.doorHintShown.boss) {
        showHint('Defeat the boss first!', 1.8);
        d.doorHintShown.boss = true;
      }
    } else {
      d.doorHintShown.boss = false;
    }
  }
  // boss-treasure chest
  if (d.roomIndex === 3 && !d.chestOpened) {
    const cy = Math.floor(room.h / 2), cx = Math.floor(room.w / 2);
    if (room.grid[cy][cx] === T.CHEST) {
      const chestX = (cx + 0.5) * CONFIG.TILE, chestY = (cy + 0.5) * CONFIG.TILE;
      const nearChest = Math.hypot(hero.x - chestX, hero.y - chestY) < 18 &&
        (Input.keys['e'] || Input.keys['E'] || hero.pendingAttackTarget === null && chestTapped(chestX, chestY));
      if (nearChest) {
        Input.keys['e'] = Input.keys['E'] = false;
        if (d.hasBossKey) openDungeonChest(d);
        else if (!d.doorHintShown.chest) { showHint('Needs the Boss Key!', 1.8); d.doorHintShown.chest = true; }
      }
    }
  }
}
function chestTapped(cx, cy) {
  if (!Input.tapped) return false;
  const wp = worldPointFromScreen(Input.tapX, Input.tapY);
  if (Math.hypot(wp.x - cx, wp.y - cy) < 18) { Input.tapped = false; return true; }
  return false;
}

const ABILITY_BY_DUNGEON = {

function defeatMiniboss(d, e) {
  d.bossDefeated = true;
  d.hasBossKey = true;
  spawnFloatingText(e.x, e.y - 20, 'BOSS KEY!', '#ffd84a');
  spawnHeartPiece(e.x, e.y + 14, d);
}
function spawnHeartPiece(x, y, d) {
  heartPieces.push({ x, y, t: 0, dungeonId: d ? d.def.id : null });
}
function updateDungeonRoom(dt, room) {
  const d = world.dungeon;
  handleDungeonDoors(d, room, dt);
  updateDungeonPuzzle(d, dt);

  // miniboss extra attack: periodic dash toward hero (bug #5: this hook
  // must keep working even while the math/revive popup is open elsewhere)
  for (const e of d.enemies[d.roomIndex]) {
    if (!e.alive || !e.isMiniboss) continue;
    e.dashTimer -= dt;
    if (e.dashTimer <= 0) {
      e.dashTimer = 3;
      const dx = hero.x - e.x, dy = hero.y - e.y;
      const dist = Math.hypot(dx, dy) || 1;
      e.hopDx = (dx / dist) * 140; e.hopDy = (dy / dist) * 140;
      screenShake(2, 0.15);
    }
    e.hopDx *= 0.92; e.hopDy *= 0.92;
    moveWithCollision(e, e.hopDx * dt, e.hopDy * dt, room);
    if (!e.alive) continue;
    if (Math.hypot(hero.x - e.x, hero.y - e.y) < (e.w + hero.w) / 2 - 2) damageHero(1, e.x, e.y);
    if (e.hp <= 0 && !d.bossDefeated) defeatMiniboss(d, e);
  }

  // room-edge transitions (only when the door there is open floor)
  const midY = Math.floor(room.h / 2);
  if (hero.x < CONFIG.TILE * 1.2 && room.grid[midY][0] === T.FLOOR) {
    if (d.roomIndex === 0) exitDungeonToOverworld();
    else dungeonGoRoom(d, d.roomIndex - 1, 'east');
  } else if (hero.x > (room.w - 1.2) * CONFIG.TILE && room.grid[midY][room.w - 1] === T.FLOOR) {
    dungeonGoRoom(d, d.roomIndex + 1, 'west');
  }

  // small key pickup from pots (handled generically in smashPot; check here after smash)
  if (d.roomIndex === 0 && !d.hasSmallKey) {
    const keyPot = d.pots[0].find(p => p.holdsSmallKey);
    if (keyPot && !keyPot.alive && !keyPot.keyGiven) {
      keyPot.keyGiven = true;
      d.hasSmallKey = true;
      spawnFloatingText(keyPot.x, keyPot.y - 10, 'Small Key!', '#ffd84a');
      SFX.coin(2);
    }
  }

  // heart piece pickups
  for (let i = heartPieces.length - 1; i >= 0; i--) {
    const hp = heartPieces[i];
    hp.t += dt;
    if (Math.hypot(hero.x - hp.x, hero.y - hp.y) < 14) {
      collectHeartPiece(hp);
      heartPieces.splice(i, 1);
    }
  }
}

function collectHeartPiece(hp) {
  player.maxHearts++;
  player.hearts = player.maxHearts;
  spawnFloatingText(hp.x, hp.y - 16, 'HEART PIECE!', '#ff8fa8');
  SFX.revive();
}

const MEDALLION_NAMES = { forest: 'Forest Medallion', fire: 'Fire Medallion', water: 'Water Medallion', shadow: 'Shadow Medallion' };
function medallionCount() { return Object.values(player.medallions).filter(Boolean).length; }
function missingMedallionNames() {
  return Object.keys(MEDALLION_NAMES).filter(k => !player.medallions[k]).map(k => MEDALLION_NAMES[k]);
}

function buildCastle() {

  const hallwayEnemies = [
    Object.assign(makeDungeonEnemy('wolf', 8 * CONFIG.TILE, 4 * CONFIG.TILE), { hp: 4, maxHp: 4 }),
    Object.assign(makeDungeonEnemy('wraith', 8 * CONFIG.TILE, 7 * CONFIG.TILE), { hp: 4, maxHp: 4 }),
  ];

      { map: hallway, pots: [], enemies: hallwayEnemies },

    ],

    startTime: 0,
  };
}
const castle = buildCastle();

function castleEntranceCheck() {
  const n = medallionCount();
  if (n < 4) {
    const missing = missingMedallionNames().join(', ');
    showHint('The castle door needs all 4 medallions (' + n + '/4). Missing: ' + missing, 2.5);
    return false;
  }
  return true;
}

function enterCastle() {
  if (world.mode !== 'overworld') return;
  if (!castleEntranceCheck()) return;
  fadeTo(() => {
    world.mode = 'castle';
    castle.roomIndex = 0;
    world.returnSpot = { x: hero.x, y: hero.y + CONFIG.TILE };
    hero.x = 2 * CONFIG.TILE; hero.y = Math.floor(castle.rooms[0].map.h / 2) * CONFIG.TILE;
    SFX.door();
  });
}

function makeGanon(x, y) {
  return {
    type: 'ganon', x, y, w: 44, h: 48, hp: CONFIG.GANON_MAX_HP, maxHp: CONFIG.GANON_MAX_HP,
    defense: 0, alive: true, hitFlash: 0, isBoss: true,
    phase: 1, attackTimer: 1.5, siphonTimer: CONFIG.GANON_SIPHON_INTERVAL,
    telegraph: 0, teleportCooldown: 0, projectiles: [],
  };
}

function updateCastleRoom(dt, map) {
  // hallway -> arena transition (one-way; no locked door, but no going back)
  if (castle.roomIndex === 0) {
    const midY = Math.floor(map.h / 2);
    if (hero.x > (map.w - 1.2) * CONFIG.TILE && map.grid[midY][map.w - 1] === T.FLOOR) {
      fadeTo(() => {
        castle.roomIndex = 1;
        hero.x = 2 * CONFIG.TILE; hero.y = Math.floor(castle.rooms[1].map.h / 2) * CONFIG.TILE;
        if (!castle.ganon) {
          castle.ganon = makeGanon((castle.rooms[1].map.w - 5) * CONFIG.TILE, Math.floor(castle.rooms[1].map.h / 2) * CONFIG.TILE);
          castle.rooms[1].enemies = [castle.ganon];
          castle.startTime = performance.now();
          screenShake(6, 0.3);
          SFX.ganonLaugh();
        }
      });
    }
  } else if (castle.roomIndex === 1 && castle.ganon) {
    updateGanon(dt, map);
  }
}

function ganonProjectileSpeed() { return castle.ganon.phase >= 3 ? 130 : 90; }

function updateGanon(dt, map) {
  const g = castle.ganon;
  if (!g.alive) return;
  const frac = g.hp / g.maxHp;
  g.phase = frac <= CONFIG.GANON_PHASE3_HP_FRAC ? 3 : frac <= CONFIG.GANON_PHASE2_HP_FRAC ? 2 : 1;
  const speedMult = g.phase === 3 ? 0.55 : 1;

  if (g.hitFlash > 0) g.hitFlash -= dt;
  if (g.telegraph > 0) {
    g.telegraph -= dt;
    if (g.telegraph <= 0) ganonUnleashAttack(g);
  } else {
    g.attackTimer -= dt;
    if (g.attackTimer <= 0) {
      g.attackTimer = CONFIG.GANON_ATTACK_INTERVAL * speedMult;
      g.telegraph = 0.5; // flash/wind-up before the attack lands
    }
  }

  if (g.phase >= 2) {
    g.teleportCooldown -= dt;
    if (g.teleportCooldown <= 0) {
      g.teleportCooldown = 3.5 * speedMult;
      const ang = Math.random() * Math.PI * 2;
      const dist = 60 + Math.random() * 40;
      let nx = hero.x + Math.cos(ang) * dist, ny = hero.y + Math.sin(ang) * dist;
      nx = Math.max(3 * CONFIG.TILE, Math.min((map.w - 3) * CONFIG.TILE, nx));
      ny = Math.max(3 * CONFIG.TILE, Math.min((map.h - 3) * CONFIG.TILE, ny));
      g.x = nx; g.y = ny;
      spawnConfetti(g.x, g.y, 6);
    }
    g.siphonTimer -= dt;
    if (g.siphonTimer <= 0) {
      g.siphonTimer = CONFIG.GANON_SIPHON_INTERVAL;
      const stolen = Math.min(player.ap, CONFIG.GANON_SIPHON_AP);
      player.ap -= stolen;
      spawnFloatingText(hero.x, hero.y - 24, '-' + stolen + ' AP (Dark Siphon!)', '#c060ff');
      screenShake(3, 0.2);
    }
  }

  // projectiles
  for (let i = g.projectiles.length - 1; i >= 0; i--) {
    const p = g.projectiles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0 || tileSolidAt(map, p.x, p.y)) { g.projectiles.splice(i, 1); continue; }
    if (Math.hypot(hero.x - p.x, hero.y - p.y) < 10) {
      damageHero(1, p.x, p.y);
      g.projectiles.splice(i, 1);
    }
  }

  // melee contact (phase 1 sword duel + any phase touch)
  if (Math.hypot(hero.x - g.x, hero.y - g.y) < (g.w + hero.w) / 2 - 6) {
    damageHero(1, g.x, g.y);
  }

  if (g.hp <= 0) ganonDefeated(g);
}

function ganonUnleashAttack(g) {
  if (g.phase === 1) {
    // slow telegraphed sword swing - melee only, handled by contact check
    SFX.hit();
  } else {
    const count = g.phase >= 3 ? 2 : 1;
    for (let i = 0; i < count; i++) {
      const spread = (i - (count - 1) / 2) * 0.3;
      const ang = Math.atan2(hero.y - g.y, hero.x - g.x) + spread;
      const spd = ganonProjectileSpeed();
      g.projectiles.push({ x: g.x, y: g.y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, life: 3 });
    }
    SFX.swish();
  }
}

function damageGanon(g, weaponKind) {
  let dmg = computeDamage(weaponKind, g.defense);
  if (g.phase === 3) dmg *= 2; // takes double damage in phase 3
  g.hp -= dmg; g.hitFlash = 0.1;
  spawnFloatingText(g.x, g.y - 24, '-' + dmg, '#ffffff');
  if (g.hp <= 0 && g.alive) ganonDefeated(g);
  else SFX.hit();
}

function ganonDefeated(g) {
  if (!g.alive) return;
  g.alive = false;
  castle.defeated = true;
  screenShake(8, 0.5);
  spawnConfetti(g.x, g.y, 40);
  SFX.victoryMelody();
  player.unlockedSkins.golden = true;
  player.skin = 'golden';
  victoryStats.timeMs = performance.now() - castle.startTime;
  victoryStats.gold = hud.gold;
  victoryStats.questionsAnswered = player.questionsAnswered;
  victoryStats.revivesUsed = player.revivesUsed;
  victoryStats.level = player.level;
  setTimeout(() => { gameState = STATE.VICTORY; }, 1400);
}

function tileSolidAt(map, px, py) {
  const tx = Math.floor(px / CONFIG.TILE), ty = Math.floor(py / CONFIG.TILE);
  if (tx < 0 || ty < 0 || tx >= map.w || ty >= map.h) return true;
  const t = map.grid[ty][tx];
  return SOLID_TILES.has(t);
}

// axis-separated collision so hero slides along walls
function moveWithCollision(entity, dx, dy, map) {
  const hw = entity.w / 2, hh = entity.h / 2;
  if (dx !== 0) {
    const nx = entity.x + dx;
    const corners = [[nx - hw, entity.y - hh], [nx + hw, entity.y - hh], [nx - hw, entity.y + hh - 1], [nx + hw, entity.y + hh - 1]];
    if (!corners.some(c => tileSolidAt(map, c[0], c[1]))) entity.x = nx;
  }
  if (dy !== 0) {
    const ny = entity.y + dy;
    const corners = [[entity.x - hw, ny - hh], [entity.x + hw, ny - hh], [entity.x - hw, ny + hh - 1], [entity.x + hw, ny + hh - 1]];
    if (!corners.some(c => tileSolidAt(map, c[0], c[1]))) entity.y = ny;
  }
}

function damageEnemy(e, weaponKind) {

  e.hp -= dmg; e.hitFlash = 0.1;

    if (Math.random() < tierHeartChance()) spawnHeartPickup(e.x, e.y);
    if (e.xp) gainXP(e.xp);

  }

function trySwingSword() {
  if (player.attackCooldown > 0 || dialogue.active || player.downed) return;
  const range = swordReachPx();
  if (!spendAP(CONFIG.SWORD_AP_COST)) {
    showHint('Not enough AP! Press Q to earn more!', 2);
    player.zeroApAttackTimer = 0.0001; // start the auto-popup countdown
    return;
  }
  player.attackCooldown = CONFIG.SWORD_COOLDOWN;
  player.swordSwingT = 0.2;
  SFX.swish();
  // lunge
  const lunge = 6;
  const dirVec = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }[hero.facing];
  moveWithCollision(hero, dirVec[0] * lunge, dirVec[1] * lunge, currentMap());

  // hit anything within range + facing arc (~120deg)
  const kind = equippedSwordKind();
  const facingAngle = { up: -Math.PI / 2, down: Math.PI / 2, left: Math.PI, right: 0 }[hero.facing];
  for (const e of currentEnemies()) {
    if (!e.alive) continue;
    const d = Math.hypot(e.x - hero.x, e.y - hero.y);
    if (d > range) continue;
    const ang = Math.atan2(e.y - hero.y, e.x - hero.x);
    let diff = Math.abs(ang - facingAngle);
    if (diff > Math.PI) diff = Math.PI * 2 - diff;
    if (diff < Math.PI * 0.65) damageEnemy(e, kind);
  }
  for (const p of currentPots()) {
    if (!p.alive) continue;
    const d = Math.hypot(p.x - hero.x, p.y - hero.y);
    if (d <= range) smashPot(p);
  }
}

// --- Boomerang (Phase 3) ---
const boomerangs = []; // {x,y,vx,vy,t,returning,hitSet}
function throwBoomerang() {
  if (player.attackCooldown > 0 || dialogue.active || player.downed) return;
  if (!spendAP(CONFIG.BOOMERANG_AP_COST)) {
    showHint('Not enough AP! Press Q to earn more!', 2);
    player.zeroApAttackTimer = 0.0001;
    return;
  }
  player.attackCooldown = CONFIG.SWORD_COOLDOWN;
  const dirVec = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }[hero.facing];
  const speed = player.owned.galeBoomerang ? 240 : 180;
  const dist = player.owned.galeBoomerang ? 170 : 120;
  SFX.boomerangThrow();
  boomerangs.push({
    x: hero.x, y: hero.y, vx: dirVec[0] * speed, vy: dirVec[1] * speed,
    dist, traveled: 0, returning: false, hitOnce: player.owned.galeBoomerang, hasHit: false,
  });
}
function updateBoomerangs(dt, map) {
  for (let i = boomerangs.length - 1; i >= 0; i--) {
    const b = boomerangs[i];
    if (!b.returning) {
      b.x += b.vx * dt; b.y += b.vy * dt;
      b.traveled += Math.hypot(b.vx, b.vy) * dt;
      if (tileSolidAt(map, b.x, b.y) || b.traveled >= b.dist) { b.returning = true; SFX.boomerangReturn(); }
    } else {
      const dx = hero.x - b.x, dy = hero.y - b.y;
      const d = Math.hypot(dx, dy) || 1;
      b.x += (dx / d) * 260 * dt; b.y += (dy / d) * 260 * dt;
      if (d < 10) { boomerangs.splice(i, 1); continue; }
    }
    for (const e of currentEnemies()) {
      if (!e.alive) continue;
      if (Math.hypot(e.x - b.x, e.y - b.y) < 10) {
        if (!b.hasHit || (player.owned.galeBoomerang && !b.returning === false)) {
          damageEnemy(e, player.owned.galeBoomerang ? 'galeBoomerang' : 'boomerang');
          b.hasHit = true;
        }
      }
    }
  }
}

function faceToward(x, y) {
  const dx = x - hero.x, dy = y - hero.y;
  if (Math.abs(dx) > Math.abs(dy)) hero.facing = dx < 0 ? 'left' : 'right';
  else hero.facing = dy < 0 ? 'up' : 'down';
}
function fireActiveWeapon() {
  const w = player.slots[player.activeSlot];
  if (w === 'boomerang' || w === 'galeBoomerang') throwBoomerang();
  else if (w === 'bow') fireArrow();
  else trySwingSword();
}
const bombs = []; // {x,y,t}
function throwBomb() {
  if (!player.bombBag || dialogue.active || player.downed) return;
  const dirVec = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }[hero.facing];
  SFX.bombFuse();
  bombs.push({ x: hero.x + dirVec[0] * 14, y: hero.y + dirVec[1] * 14, t: 2 });
}
function updateBombs(dt) {
  for (let i = bombs.length - 1; i >= 0; i--) {
    const b = bombs[i];
    b.t -= dt;
    if (b.t <= 0) {
      spawnConfetti(b.x, b.y, 10);
      screenShake(4, 0.2);
      SFX.bombExplode();
      for (const e of currentEnemies()) if (e.alive && Math.hypot(e.x - b.x, e.y - b.y) < 28) damageEnemy(e, 'bow');
      bombs.splice(i, 1);
    }
  }
}

// --- Bow & arrows (Phase 3) ---
const arrows = []; // {x,y,vx,vy,type}
function fireArrow() {
  if (player.attackCooldown > 0 || dialogue.active || player.downed || !player.owned.bow) return;
  if (!spendAP(1)) {
    showHint('Not enough AP! Press Q to earn more!', 2);
    player.zeroApAttackTimer = 0.0001;
    return;
  }
  player.attackCooldown = 0.2;
  const dirVec = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }[hero.facing];
  if (player.arrowType === 'fire') SFX.fireWhoosh();
  else if (player.arrowType === 'ice') SFX.iceChime();
  else SFX.bowTwang();
  arrows.push({ x: hero.x, y: hero.y, vx: dirVec[0] * 260, vy: dirVec[1] * 260, type: player.arrowType });
}
function updateArrows(dt, map) {
  for (let i = arrows.length - 1; i >= 0; i--) {
    const a = arrows[i];
    a.x += a.vx * dt; a.y += a.vy * dt;
    if (tileSolidAt(map, a.x, a.y)) { arrows.splice(i, 1); continue; } // clink off walls
    const npcHit = allNPCs().find(n => Math.hypot(n.x - a.x, n.y - a.y) < 8);
    if (npcHit) { arrows.splice(i, 1); continue; } // clink off NPCs, never pass through
    let hit = false;
    for (const e of currentEnemies()) {
      if (!e.alive) continue;
      if (Math.hypot(e.x - a.x, e.y - a.y) < 9) {
        damageEnemy(e, 'bow');
        if (a.type === 'fire' && e.alive) e.burnT = 2;
        if (a.type === 'ice' && e.alive) e.slowT = 2;
        hit = true; break;
      }
    }
    if (hit) arrows.splice(i, 1);
    else if (a.x < 0 || a.y < 0 || a.x > map.w * CONFIG.TILE || a.y > map.h * CONFIG.TILE) arrows.splice(i, 1);
  }
}

function smashPot(p) {
  if (!p.alive) return;
  p.alive = false;
  if (p.isBush) {
    SFX.inkSplat(); // reused as a quick "rustle" sound for cut bushes
    const roll = Math.random();
    if (roll < 0.3) spawnCoin(p.x, p.y);
    else if (roll < 0.42) spawnHeartPickup(p.x, p.y);
    return;
  }
  SFX.potSmash();
  if (Math.random() < 0.6) spawnCoin(p.x, p.y);
}

// --- Math popup / AP earning ---
const QUESTION_TIERS = {
  LITTLE_HERO: { label: 'Little Hero', grade: '1st-2nd grade' },
  ADVENTURER: { label: 'Adventurer', grade: '3rd-4th grade' },
  MASTER: { label: 'Master', grade: '5th-6th grade' },
  LEGEND: { label: 'Legend', grade: '7th grade+' },
};

function generateMathQuestion(tier) {
  return QUESTION_BANK[CONFIG.ACTIVE_CATEGORY].generateQuestion(tier);
}

const mathPopup = { active: false, question: null, wrongIdx: -1, purpose: 'ap' };
function openMathPopup(purpose) {
  mathPopup.active = true;
  mathPopup.question = generateMathQuestion(CONFIG.DIFFICULTY);
  mathPopup.wrongIdx = -1;
  mathPopup.purpose = purpose || 'ap'; // 'ap' or 'revive'
}
function closeMathPopup() {
  mathPopup.active = false; mathPopup.question = null;
}
function answerMathPopup(idx) {
  if (!mathPopup.active) return;
  const q = mathPopup.question;
  if (idx === q.correctIndex) {
    player.questionsAnswered++;
    SFX.correct();
    if (mathPopup.purpose === 'revive') {
      closeMathPopup();
      doRevive();
    } else {
      const reward = tierAPReward();
      gainAP(reward);
      closeMathPopup();
      spawnConfetti(hero.x, hero.y, 14);
      spawnFloatingText(hero.x, hero.y - 20, '+' + reward + ' AP', '#8effc1');
      player.zeroApAttackTimer = 0;
    }
  } else {
    SFX.wrong();
    mathPopup.wrongIdx = idx;
    showHint('', 0);
  }
}

function doRevive() {
  player.downed = false;
  player.hearts = Math.min(player.maxHearts, 3);
  player.invincibleT = 3;
  player.revivesUsed++;
  SFX.revive();
  spawnFloatingText(hero.x, hero.y - 24, 'REVIVED!', '#ffe066');
}

function damageHero(amount, fromX, fromY) {
  if (player.invincibleT > 0 || player.downed) return;
  player.hearts -= amount;
  player.invincibleT = 1.0;
  SFX.hurt();
  const kx = hero.x - fromX, ky = hero.y - fromY;
  const len = Math.hypot(kx, ky) || 1;
  moveWithCollision(hero, (kx / len) * 14, (ky / len) * 14, currentMap());
  screenShake(4, 0.2);
  if (player.hearts <= 0) {
    player.hearts = 0;
    player.downed = true;
    openMathPopup('revive');
  }
}

// --- screen shake ---
let shakeT = 0, shakeMag = 0;
function screenShake(mag, dur) { shakeMag = mag; shakeT = dur; }

function updateEnemies(dt, map) {
  for (const e of currentEnemies()) {
    if (!e.alive || e.isMiniboss || e.isBoss) continue; // minibosses/Ganondorf handled by their own update fns
    if (e.hitFlash > 0) e.hitFlash -= dt;
    const dist = Math.hypot(hero.x - e.x, hero.y - e.y);

    if (e.type === 'slime' || e.type === 'wolf' || e.type === 'fireImp' || e.type === 'wraith') {
      e.hopTimer -= dt;
      if (dist < e.range) {
        if (e.hopTimer <= 0) {
          e.hopTimer = 0.9;
          const ux = (hero.x - e.x) / (dist || 1), uy = (hero.y - e.y) / (dist || 1);
          e.hopDx = ux * 40; e.hopDy = uy * 40;
        }
      } else if (e.hopTimer <= 0) {
        e.hopTimer = 1.5; e.hopDx = 0; e.hopDy = 0;
      }
      moveWithCollision(e, e.hopDx * dt, e.hopDy * dt, map);
      e.hopDx *= 0.9; e.hopDy *= 0.9;
    } else if (e.type === 'bat') {
      e.t += dt;
      if (dist < e.range) {
        const ux = (hero.x - e.x) / (dist || 1);
        e.x += ux * 35 * dt;
        e.y = e.baseY + Math.sin(e.t * 4) * 14;
      } else {
        e.y = e.baseY + Math.sin(e.t * 2) * 6;
      }
    }

    // contact damage
    if (Math.hypot(hero.x - e.x, hero.y - e.y) < (e.w + hero.w) / 2 - 2) {
      damageHero(1, e.x, e.y);
    }
  }
}

function updateCoinsAndPickups(dt) {
  let comboPitch = 0;
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    c.t += dt;
    if (c.t < 0.35) {
      c.x += c.vx * dt; c.y += c.vy * dt; c.vy += 220 * dt;
      if (c.vy > 0 && c.y > c.startY) c.vy *= -0.4;
    } else {
      const d = Math.hypot(hero.x - c.x, hero.y - c.y);
      if (d < 60) {
        const ux = (hero.x - c.x) / (d || 1), uy = (hero.y - c.y) / (d || 1);
        c.x += ux * 220 * dt; c.y += uy * 220 * dt;
      }
      if (d < 8) {
        hud.gold += 1;
        SFX.coin(comboPitch++);
        coins.splice(i, 1);
      }
    }
  }
  for (let i = heartPickups.length - 1; i >= 0; i--) {
    const h = heartPickups[i];
    h.t += dt;
    if (Math.hypot(hero.x - h.x, hero.y - h.y) < 12) {
      if (player.hearts < player.maxHearts) player.hearts++;
      spawnFloatingText(h.x, h.y - 10, '+1', '#ff8fa8');
      heartPickups.splice(i, 1);
    }
  }
}

function updateFloatingAndConfetti(dt) {
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const f = floatingTexts[i];
    f.life -= dt; f.y -= 20 * dt;
    if (f.life <= 0) floatingTexts.splice(i, 1);
  }
  for (let i = confettiParticles.length - 1; i >= 0; i--) {
    const c = confettiParticles[i];
    c.life -= dt; c.x += c.vx * dt; c.y += c.vy * dt; c.vy += 120 * dt;
    if (c.life <= 0) confettiParticles.splice(i, 1);
  }
}

const shop = { active: false, scroll: 0 };
function openShop() { shop.active = true; }

function canBuy(item) {
  if (item.prereq && !player.owned[item.prereq]) return false;
  if (item.consumable) return true;
  if (item.skin) return !player.unlockedSkins[item.skin];
  if (item.id === 'heartContainer') return player.heartContainersBought < 2;
  return !player.owned[item.id];
}
function buyItem(item) {
  if (hud.gold < item.price) { showHint("That's okay! Come back with more gold.", 1.5); return; }
  if (!canBuy(item)) return;
  hud.gold -= item.price;
  if (item.skin) {
    player.unlockedSkins[item.skin] = true;
    player.skin = item.skin;
  } else if (item.consumable) {
    player.owned[item.id] = (player.owned[item.id] || 0) + 1;
  } else if (item.id === 'heartContainer') {
    player.heartContainersBought++;
    player.maxHearts++; player.hearts = player.maxHearts;
  } else {
    player.owned[item.id] = true;
    // auto-assign new weapons to an empty slot
    if (item.id === 'boomerang' || item.id === 'bow') {
      const emptySlot = player.slots.findIndex((s, i) => i > 0 && !s);
      if (emptySlot >= 0) player.slots[emptySlot] = item.id;
    }
  }
  SFX.coin(0);
  spawnFloatingText(hero.x, hero.y - 20, 'Bought!', '#8effc1');
}

// =========================================================================
// Update
// =========================================================================
function update(dtMs) {
  const dt = dtMs / 1000;
  updateFade(dt);
  setMusicArea(musicAreaForWorld());
  updateMusic(dt);
  if (Input.keys['m'] || Input.keys['M']) { Input.keys['m'] = Input.keys['M'] = false; audioSettings.muted = !audioSettings.muted; }
  if (Input.tapped && tapSpeakerIcon(Input.tapX, Input.tapY)) { Input.tapped = false; }
  if (Input.swipe) {
    const slotSize = 48, gap = 6, startX = CONFIG.GAME_W - (slotSize + gap) * 3 - 10, y = CONFIG.GAME_H - slotSize - 10;
    for (let i = 0; i < 3; i++) {
      const x = startX + i * (slotSize + gap);
      if (pointInRect(Input.swipe.x, Input.swipe.y, { x, y, w: slotSize, h: slotSize }) && player.slots[i] === 'bow') {
        cycleArrowType();
      }
    }
    Input.swipe = null;
  }

  if (gameState === STATE.TITLE) {
    if (Input.tapped) {
      const btns = getDifficultyButtons();
      for (const b of btns) {
        if (pointInRect(Input.tapX, Input.tapY, b)) {
          pickDifficulty(b.name);
          break;
        }
      }
      Input.tapped = false;
    }
    if (Input.keys['Enter'] || Input.keys[' ']) {
      pickDifficulty(CONFIG.DIFFICULTY);
    }
    return;
  }

  if (gameState === STATE.PLAYING) {
    updatePlaying(dt);
  }

  if (gameState === STATE.VICTORY) {
    if (Input.tapped) { Input.tapped = false; resetGame(); }
    if (Input.keys['Enter'] || Input.keys[' ']) { Input.keys['Enter'] = Input.keys[' '] = false; resetGame(); }
  }
}

function resetGame() {
  location.reload();
}

function tapSpeakerIcon(sx, sy) {

  ctx.beginPath();
  ctx.moveTo(r.x + 11, r.y + 11); ctx.lineTo(r.x + 17, r.y + 6); ctx.lineTo(r.x + 17, r.y + 22); ctx.lineTo(r.x + 11, r.y + 17);
  ctx.fill();
  if (audioSettings.muted) {
    ctx.strokeStyle = '#ff4040'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(r.x + 4, r.y + 4); ctx.lineTo(r.x + 24, r.y + 24); ctx.stroke();
  } else {
